        function render() {
            const container = document.getElementById('question-container');
            let html = '';
            questions.forEach((q, idx) => {
                if (q.section) {
                    html += `<div class="section-title">${q.section}</div>`;
                }
                let inputHtml = '';
                if (q.type === 'pg') {
                    q.options.forEach((opt, i) => {
                        inputHtml += `<label class="radio-label"><input type="radio" name="q${q.id}" value="${i}"> <span>${String.fromCharCode(65 + i)}. ${opt}</span></label>`;
                    });
                } else if (q.type === 'pg_kompleks') {
                    inputHtml += `<div style="font-size:0.85em; color:#7f8c8d; margin-bottom:6px; font-weight:700;">📌 <i>Pilih lebih dari satu jawaban yang benar:</i></div>`;
                    q.options.forEach((opt, i) => {
                        inputHtml += `<label class="checkbox-label"><input type="checkbox" name="q${q.id}" value="${i}"> <span>${String.fromCharCode(65 + i)}. ${opt}</span></label>`;
                    });
                } else if (q.type === 'benar_salah') {
                    inputHtml = `<div class="tf-group">
                        <label class="tf-label"><input type="radio" name="q${q.id}" value="Benar"> <span>🟢 Benar</span></label>
                        <label class="tf-label"><input type="radio" name="q${q.id}" value="Salah"> <span>🔴 Salah</span></label>
                    </div>`;
                } else if (q.type === 'memasangkan') {
                    inputHtml = `<div class="match-box">
                        <div class="match-premise">Pasangkan pernyataan: <b>"${q.premise || q.text}"</b></div>
                        <select class="match-select" name="q${q.id}" onchange="updateProgress()">
                            <option value="">-- Pilih Pasangan yang Tepat --</option>
                            ${q.options.map(o => `<option value="${o}">${o}</option>`).join('')}
                        </select>
                    </div>`;
                } else if (q.type === 'isian') {
                    inputHtml = `<input type="text" class="input-text" name="q${q.id}" id="input-q${q.id}" placeholder="Tulis jawaban singkat di sini..." autocomplete="off">`;
                } else if (q.type === 'uraian') {
                    inputHtml = `<textarea class="input-text" name="q${q.id}" id="input-q${q.id}" placeholder="Tulis jawaban uraian lengkap di sini..." rows="3"></textarea>`;
                }
                html += `<div class="question-item" id="qcard-${q.id}">
                    <div class="q-text"><span class="q-number">${idx + 1}</span>${q.text}</div>
                    <div class="options-group">${inputHtml}</div>
                    <div class="feedback-box" id="fb-${q.id}"></div>
                </div>`;
            });
            container.innerHTML = html;
            updateProgress();
        }

        function updateProgress() {
            let answered = 0;
            questions.forEach(q => {
                if (q.type === 'pg' || q.type === 'benar_salah') {
                    if (document.querySelector(`input[name="q${q.id}"]:checked`)) answered++;
                } else if (q.type === 'pg_kompleks') {
                    if (document.querySelectorAll(`input[name="q${q.id}"]:checked`).length > 0) answered++;
                } else if (q.type === 'memasangkan') {
                    const el = document.querySelector(`select[name="q${q.id}"]`);
                    if (el && el.value.trim()) answered++;
                } else {
                    const el = document.querySelector(`[name="q${q.id}"]`);
                    if (el && el.value.trim()) answered++;
                }
            });
            document.getElementById('progress-fill').style.width = `${(answered / questions.length) * 100}%`;
        }

        document.addEventListener('change', updateProgress);
        document.addEventListener('input', updateProgress);

        function cleanString(str) {
            return (str || '')
                .toLowerCase()
                .replace(/[.,/#!$%^&*;:{}=\-_`~()?'"“”]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function submitExam() {
            let score = 0;
            let maxAuto = 0;

            questions.forEach(q => {
                const fb = document.getElementById(`fb-${q.id}`);
                if (q.type === 'pg') {
                    maxAuto++;
                    const sel = document.querySelector(`input[name="q${q.id}"]:checked`);
                    if (sel && parseInt(sel.value) === q.answer) {
                        score++;
                        fb.className = 'feedback-box correct';
                        fb.innerHTML = '✅ <b>Benar!</b> ' + (q.hint || '');
                    } else {
                        fb.className = 'feedback-box wrong';
                        const correctOpt = q.options[q.answer];
                        fb.innerHTML = `❌ <b>Kurang tepat.</b> Jawaban benar: <b>${String.fromCharCode(65 + q.answer)}. ${correctOpt}</b>. <br>💡 <i>${q.hint || ''}</i>`;
                    }
                } else if (q.type === 'pg_kompleks') {
                    maxAuto++;
                    const checked = [...document.querySelectorAll(`input[name="q${q.id}"]:checked`)].map(c => parseInt(c.value));
                    const isAllCorrect = checked.length === q.answer.length && checked.every(v => q.answer.includes(v));
                    if (isAllCorrect) {
                        score++;
                        fb.className = 'feedback-box correct';
                        fb.innerHTML = '✅ <b>Benar Semua!</b> ' + (q.hint || '');
                    } else {
                        fb.className = 'feedback-box wrong';
                        const correctLetters = q.answer.map(i => `${String.fromCharCode(65 + i)}. ${q.options[i]}`).join('; ');
                        fb.innerHTML = `❌ <b>Jawaban yang benar:</b> <b>${correctLetters}</b>.<br>💡 <i>${q.hint || ''}</i>`;
                    }
                } else if (q.type === 'benar_salah') {
                    maxAuto++;
                    const sel = document.querySelector(`input[name="q${q.id}"]:checked`);
                    const val = sel ? sel.value : '';
                    if (val === q.answer) {
                        score++;
                        fb.className = 'feedback-box correct';
                        fb.innerHTML = '✅ <b>Tepat Sekali!</b> Pernyataan ini memang <b>' + q.answer + '</b>. ' + (q.hint || '');
                    } else {
                        fb.className = 'feedback-box wrong';
                        fb.innerHTML = `❌ <b>Kurang tepat.</b> Pernyataan ini seharusnya: <b>${q.answer}</b>.<br>💡 <i>${q.hint || ''}</i>`;
                    }
                } else if (q.type === 'memasangkan') {
                    maxAuto++;
                    const sel = document.querySelector(`select[name="q${q.id}"]`);
                    const val = sel ? sel.value.trim() : '';
                    if (val && cleanString(val) === cleanString(q.answer)) {
                        score++;
                        fb.className = 'feedback-box correct';
                        fb.innerHTML = '✅ <b>Pasangan Tepat!</b> ' + (q.hint || '');
                    } else {
                        fb.className = 'feedback-box wrong';
                        fb.innerHTML = `❌ <b>Pasangan yang benar:</b> <b>${q.answer}</b>.<br>💡 <i>${q.hint || ''}</i>`;
                    }
                } else if (q.type === 'isian') {
                    maxAuto++;
                    const inputEl = document.querySelector(`[name="q${q.id}"]`);
                    const val = cleanString(inputEl ? inputEl.value : '');
                    const target = cleanString(q.answer);
                    let isCorrect = (val !== '' && (val === target || (target.length > 3 && val.includes(target)) || (val.length > 3 && target.includes(val))));
                    if (!isCorrect && q.alt && Array.isArray(q.alt)) {
                        q.alt.forEach(a => {
                            const altClean = cleanString(a);
                            if (val !== '' && (val === altClean || (altClean.length > 3 && val.includes(altClean)) || (val.length > 3 && altClean.includes(val)))) {
                                isCorrect = true;
                            }
                        });
                    }
                    if (isCorrect) {
                        score++;
                        fb.className = 'feedback-box correct';
                        fb.innerHTML = '✅ <b>Benar!</b> ' + (q.hint || '');
                    } else {
                        fb.className = 'feedback-box wrong';
                        fb.innerHTML = `❌ <b>Jawaban tepat:</b> <b>${q.answer}</b>.<br>💡 <i>${q.hint || ''}</i>`;
                    }
                } else if (q.type === 'uraian') {
                    fb.className = 'feedback-box manual';
                    fb.innerHTML = `📝 <b>Model Kunci Jawaban:</b><br>${q.answer}<br><br>💡 <i>Petunjuk Penilaian: ${q.hint || ''}</i>`;
                }
                fb.style.display = 'block';
            });

            const finalPct = maxAuto > 0 ? Math.round((score / maxAuto) * 100) : 0;
            document.getElementById('final-score').innerText = finalPct + '%';
            document.getElementById('score-detail').innerText = `Skor Otomatis: Benar ${score} dari ${maxAuto} butir soal (PG, PG Kompleks, B/S, Memasangkan, Isian). 5 butir soal Uraian dinilai mandiri dengan panduan kunci jawaban guru.`;
            document.getElementById('score-board').style.display = 'block';
            document.getElementById('footer-action').style.display = 'none';
            document.getElementById('progress-fill').style.width = '100%';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function retryExam() {
            questions.forEach(q => {
                if (q.type === 'pg' || q.type === 'pg_kompleks' || q.type === 'benar_salah') {
                    document.querySelectorAll(`input[name="q${q.id}"]`).forEach(i => i.checked = false);
                } else if (q.type === 'memasangkan') {
                    const sel = document.querySelector(`select[name="q${q.id}"]`);
                    if (sel) sel.value = '';
                } else {
                    const el = document.querySelector(`[name="q${q.id}"]`);
                    if (el) el.value = '';
                }
                const fb = document.getElementById(`fb-${q.id}`);
                if (fb) fb.style.display = 'none';
            });
            document.getElementById('score-board').style.display = 'none';
            document.getElementById('footer-action').style.display = 'block';
            document.getElementById('progress-fill').style.width = '0%';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        render();
    </script>
