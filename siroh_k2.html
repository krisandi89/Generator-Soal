<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian Siroh Nabawiyah Kelas 2 - SD DILARAF</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #8e44ad;
            --primary-light: #9b59b6;
            --bg: #f5eef8;
            --success: #27ae60;
            --error: #e74c3c;
            --warning: #f39c12;
            --card-bg: #ffffff;
            --text: #2d3436;
            --border: #dfe6e9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 0;
            min-height: 100vh;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 0 0 20px 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 60%);
            animation: shimmer 8s infinite;
        }

        @keyframes shimmer {

            0%,
            100% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(180deg);
            }
        }

        .header h1 {
            margin: 0;
            font-size: 2em;
            font-weight: 800;
            position: relative;
            z-index: 1;
        }

        .header p {
            margin-top: 5px;
            opacity: 0.9;
            font-size: 1em;
            position: relative;
            z-index: 1;
        }

        .header .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-top: 8px;
            position: relative;
            z-index: 1;
        }

        .progress-bar {
            height: 6px;
            background: var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), #2ecc71);
            width: 0%;
            transition: width 0.5s ease;
            border-radius: 0 3px 3px 0;
        }

        .score-board {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            display: none;
            margin-bottom: 20px;
            border-radius: 0 0 20px 20px;
            animation: slideDown 0.6s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .score-board h2 {
            font-size: 1.3em;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 4em;
            font-weight: 800;
            margin: 10px 0;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 700;
            transition: all 0.3s;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .question-list {
            padding: 25px;
        }

        .section-title {
            font-size: 0.85em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
            margin: 30px 0 15px;
            padding: 10px 15px;
            background: var(--bg);
            border-radius: 10px;
            border-left: 4px solid var(--primary);
        }

        .question-item {
            margin-bottom: 25px;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid var(--border);
            transition: all 0.3s;
            background: #fafbfc;
        }

        .q-number {
            display: inline-block;
            background: var(--primary);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            text-align: center;
            line-height: 32px;
            font-size: 0.85em;
            font-weight: 800;
            margin-right: 10px;
        }

        .q-text {
            font-size: 1em;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .input-text {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1em;
            font-family: 'Nunito', sans-serif;
            transition: border 0.3s;
        }

        .input-text:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(142, 68, 173, 0.15);
        }

        .feedback-box {
            margin-top: 12px;
            padding: 12px 15px;
            border-radius: 10px;
            display: none;
            font-size: 0.9em;
            font-weight: 600;
        }

        .correct {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid var(--success);
        }

        .wrong {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid var(--error);
        }

        .footer-action {
            background: var(--card-bg);
            padding: 20px;
            text-align: center;
            position: sticky;
            bottom: 0;
            border-top: 2px solid var(--border);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 800;
            transition: all 0.3s;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(142, 68, 173, 0.4);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🕌 Siroh Nabawiyah</h1>
            <p>SD DILARAF ISLAMIC SCHOOL — Kelas 2</p>
            <div class="badge">Asesmen Formatif Tengah Semester</div>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="score-board" id="score-board">
            <h2>📊 Nilai Kamu</h2>
            <div class="score-value" id="final-score">0</div>
            <a href="kelas2.html" class="back-btn">⬅ Kembali ke Menu Kelas 2</a>
        </div>
        <div class="question-list" id="question-container"></div>
        <div class="footer-action" id="footer-action">
            <button class="btn-submit" onclick="submitExam()">Kumpulkan ✅</button>
        </div>
    </div>
    <script>
        const questions = [
            // Bab 1: Sejarah Wajibnya Puasa Ramadan
            { id: 1, section: "Isian — Bab 1: Puasa Ramadan", text: "Puasa Ramadan diwajibkan pada bulan Syakban tahun kedua ...", answer: "Hijriah", hint: "Puasa Ramadan diwajibkan pada bulan Syakban tahun kedua Hijriah.", alt: ["hijriyah"] },
            { id: 2, text: "Selama hidupnya, Rasulullah SAW melaksanakan puasa Ramadan sebanyak ... kali.", answer: "Sembilan", hint: "Rasulullah SAW berpuasa Ramadan sebanyak sembilan kali.", alt: ["9"] },

            // Bab 2: Perang Badr
            { id: 3, section: "Isian — Bab 2: Perang Badr", text: "Perang Badr terjadi pada 17 Ramadan tahun 2 Hijriah. Kafilah dagang Quraisy dipimpin oleh ...", answer: "Abu Sufyan", hint: "Abu Sufyan memimpin kafilah dagang Quraisy dari Syam menuju Makkah.", alt: ["abu sufyan"] },
            { id: 4, text: "Jumlah pasukan kaum Muslimin dalam Perang Badr adalah ... orang.", answer: "313", hint: "Dengan 313 orang, kaum Muslimin yakin bisa menaklukkan kafilah dagang.", alt: ["tiga ratus tiga belas"] },

            // Bab 3: Perang Uhud
            { id: 5, section: "Isian — Bab 3: Perang Uhud", text: "Perang Uhud terjadi karena balas dendam kaum Quraisy setelah kalah pada Perang ...", answer: "Badr", hint: "Perang Uhud adalah balas dendam setelah kekalahan di Perang Badr.", alt: ["badar"] },
            { id: 6, text: "Sebanyak 50 pasukan pemanah ditempatkan di atas Jabal ...", answer: "Uhud", hint: "50 pasukan pemanah diposisikan di atas Jabal Uhud.", alt: ["gunung uhud"] },
            { id: 7, text: "Paman Rasulullah SAW yang syahid dalam Perang Uhud bernama ... bin Abdul Muthalib.", answer: "Hamzah", hint: "Hamzah bin Abdul Muthalib syahid karena menjadi perisai Rasulullah SAW.", alt: ["hamzah"] },

            // Bab 4: Peristiwa Bir Maunah
            { id: 8, section: "Isian — Bab 4: Peristiwa Bir Maunah", text: "Dalam perjalanan Bir Maunah, Rasulullah SAW mengutus al-Mundzir bin Amr bersama ... orang muslim pilihan.", answer: "70", hint: "70 orang muslim pilihan yang mayoritas penghafal Quran.", alt: ["tujuh puluh"] },

            // Bab 5: Perang Khandaq
            { id: 9, section: "Isian — Bab 5: Perang Khandaq", text: "Strategi kaum Muslimin dalam Perang Khandaq adalah menggali ... di sekitar Madinah.", answer: "Parit", hint: "Khandaq artinya parit. Rasulullah SAW memerintahkan menggali parit untuk pertahanan.", alt: ["khandaq"] },
            { id: 10, text: "Kaum Quraisy dalam Perang Khandaq dipimpin oleh ...", answer: "Abu Sufyan", hint: "Abu Sufyan memimpin kabilah Quraisy dalam perang ini.", alt: ["abu sufyan"] }
        ];

        const container = document.getElementById('question-container');
        let currentSection = '';

        function render() {
            let html = '';
            questions.forEach((q, idx) => {
                if (q.section && q.section !== currentSection) {
                    currentSection = q.section;
                    html += `<div class="section-title">${q.section}</div>`;
                }
                html += `<div class="question-item">
                    <div class="q-text"><span class="q-number">${idx + 1}</span>${q.text}</div>
                    <input type="text" class="input-text" name="q${q.id}" placeholder="Tulis jawaban di sini..." autocomplete="off">
                    <div class="feedback-box" id="fb-${q.id}"></div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function updateProgress() {
            let answered = 0;
            questions.forEach(q => {
                const el = document.querySelector(`[name="q${q.id}"]`);
                if (el && el.value.trim()) answered++;
            });
            document.getElementById('progress-fill').style.width = `${(answered / questions.length) * 100}%`;
        }

        document.addEventListener('input', updateProgress);

        function normalize(s) { return s.toLowerCase().replace(/[-_.,\']/g, '').trim(); }

        function submitExam() {
            let score = 0;
            questions.forEach(q => {
                const fb = document.getElementById(`fb-${q.id}`);
                const val = normalize(document.querySelector(`[name="q${q.id}"]`).value);
                const ans = normalize(q.answer);
                let isCorrect = val === ans || val.includes(ans) || (ans.includes(val) && val.length > 2);
                if (q.alt) { q.alt.forEach(a => { if (normalize(a) === val || val.includes(normalize(a))) isCorrect = true; }); }
                if (isCorrect) { score++; fb.className = 'feedback-box correct'; fb.innerHTML = '✅ Benar!'; }
                else { fb.className = 'feedback-box wrong'; fb.innerHTML = `❌ Jawaban: <b>${q.answer}</b>. ${q.hint}`; }
                fb.style.display = 'block';
            });
            const pct = Math.round((score / questions.length) * 100);
            document.getElementById('final-score').innerText = pct;
            document.getElementById('score-board').style.display = 'block';
            document.getElementById('footer-action').style.display = 'none';
            document.getElementById('progress-fill').style.width = '100%';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        render();
    </script>
</body>

</html>
