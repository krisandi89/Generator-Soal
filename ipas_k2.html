<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian IPAS Kelas 2 - SD DILARAF</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00b894;
            --primary-light: #55efc4;
            --bg: #f0faf6;
            --success: #27ae60;
            --error: #e74c3c;
            --card-bg: #ffffff;
            --text: #2d3436;
            --border: #dfe6e9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); padding: 0; min-height: 100vh; }

        .container { max-width: 850px; margin: 0 auto; background: var(--card-bg); border-radius: 0 0 20px 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); overflow: hidden; }

        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; padding: 30px; text-align: center; position: relative; overflow: hidden; }
        .header::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%); animation: shimmer 8s infinite; }
        @keyframes shimmer { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(180deg); } }
        .header h1 { margin: 0; font-size: 2em; font-weight: 800; position: relative; z-index: 1; }
        .header p { margin-top: 5px; opacity: 0.9; font-size: 1em; position: relative; z-index: 1; }
        .header .badge { display: inline-block; background: rgba(255,255,255,0.2); padding: 4px 14px; border-radius: 20px; font-size: 0.8em; margin-top: 8px; position: relative; z-index: 1; }

        .progress-bar { height: 6px; background: var(--border); position: sticky; top: 0; z-index: 100; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--success), #2ecc71); width: 0%; transition: width 0.5s ease; border-radius: 0 3px 3px 0; }

        .score-board { text-align: center; padding: 30px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; display: none; margin-bottom: 20px; border-radius: 0 0 20px 20px; animation: slideDown 0.6s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        .score-board h2 { font-size: 1.3em; margin-bottom: 5px; }
        .score-value { font-size: 4em; font-weight: 800; margin: 10px 0; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        .back-btn { display: inline-block; margin-top: 15px; padding: 10px 25px; background: rgba(255,255,255,0.2); color: white; text-decoration: none; border-radius: 25px; font-weight: 700; transition: all 0.3s; border: 2px solid rgba(255,255,255,0.4); }
        .back-btn:hover { background: rgba(255,255,255,0.3); }

        .question-list { padding: 25px; }
        .section-title { font-size: 0.85em; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: var(--primary); margin: 30px 0 15px; padding: 10px 15px; background: var(--bg); border-radius: 10px; border-left: 4px solid var(--primary); }
        .question-item { margin-bottom: 25px; padding: 20px; border-radius: 12px; border: 2px solid var(--border); transition: all 0.3s; background: #fafbfc; }
        .q-number { display: inline-block; background: var(--primary); color: white; width: 32px; height: 32px; border-radius: 50%; text-align: center; line-height: 32px; font-size: 0.85em; font-weight: 800; margin-right: 10px; }
        .q-text { font-size: 1em; line-height: 1.7; margin-bottom: 12px; }

        .input-text { width: 100%; padding: 12px 15px; border: 2px solid var(--border); border-radius: 10px; font-size: 1em; font-family: 'Nunito', sans-serif; transition: border 0.3s; }
        .input-text:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(0,184,148,0.15); }

        .feedback-box { margin-top: 12px; padding: 12px 15px; border-radius: 10px; display: none; font-size: 0.9em; font-weight: 600; }
        .correct { background: #d4edda; color: #155724; border-left: 4px solid var(--success); }
        .wrong { background: #f8d7da; color: #721c24; border-left: 4px solid var(--error); }

        .footer-action { background: var(--card-bg); padding: 20px; text-align: center; position: sticky; bottom: 0; border-top: 2px solid var(--border); }
        .btn-submit { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; border: none; padding: 15px 50px; font-size: 1.1em; border-radius: 50px; cursor: pointer; font-weight: 800; transition: all 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,184,148,0.4); }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🔬 IPAS</h1>
            <p>SD DILARAF ISLAMIC SCHOOL — Kelas 2</p>
            <div class="badge">Asesmen Formatif Tengah Semester</div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="score-board" id="score-board">
            <h2>📊 Nilai Kamu</h2>
            <div class="score-value" id="final-score">0</div>
            <a href="kelas2.html" class="back-btn">⬅ Kembali ke Menu Kelas 2</a>
        </div>
        <div class="question-list" id="question-container"></div>
        <div class="footer-action" id="footer-action">
            <button class="btn-submit" onclick="submitExam()">Kumpulkan ✅</button>
        </div>
    </div>
    <script>
        const questions = [
            // BAB 4 — Dokumen Pribadi dan Keluarga
            { id: 1, section: "Isian — Bab 4: Dokumen Pribadi & Keluarga", text: "Dokumen yang berisi keterangan tentang kelahiran seseorang disebut ...", answer: "Akta Kelahiran", hint: "Akta kelahiran adalah bukti keterangan tentang kelahiran seseorang.", alt: ["akta lahir", "akte kelahiran"] },
            { id: 2, text: "KIA (Kartu Identitas Anak) berlaku untuk anak yang berusia 0 sampai ... tahun.", answer: "17", hint: "KIA berlaku untuk anak berusia 0 sampai 17 tahun.", alt: ["tujuh belas"] },
            { id: 3, text: "Dokumen yang berisi data semua anggota keluarga disebut ...", answer: "Kartu Keluarga", hint: "Kartu Keluarga (KK) berisi keterangan lengkap sebuah keluarga.", alt: ["kk"] },
            { id: 4, text: "Jenis dokumen ada dua, yaitu dokumen pribadi dan dokumen ...", answer: "Keluarga", hint: "Dokumen pribadi milik sendiri, dokumen keluarga milik seluruh anggota keluarga." },
            { id: 5, text: "Contoh dokumen pribadi antara lain akta kelahiran, rapor, dan kartu ...", answer: "Identitas", hint: "Kartu identitas berisi data diri seseorang.", alt: ["identitas anak"] },

            // BAB 5 — Silsilah Keluarga, Peran & Tanggung Jawab
            { id: 6, section: "Isian — Bab 5: Keluarga", text: "Keluarga inti terdiri atas ayah, ibu, dan ...", answer: "Anak", hint: "Keluarga inti = ayah + ibu + anak." },
            { id: 7, text: "Ibu dari ayah atau ibu kita disebut ...", answer: "Nenek", hint: "Nenek adalah ibu dari orang tua kita." },
            { id: 8, text: "Bagan yang menyusun urutan kelahiran anggota keluarga disebut ...", answer: "Silsilah", hint: "Silsilah keluarga disusun berdasarkan urutan kelahiran.", alt: ["silsilah keluarga", "pohon keluarga"] },
            { id: 9, text: "Adik laki-laki dari ayah atau ibu kita disebut ...", answer: "Paman", hint: "Paman = adik laki-laki dari orang tua kita.", alt: ["om"] },
            { id: 10, text: "Salah satu tanggung jawab anak di rumah adalah merapikan ... setelah digunakan.", answer: "Mainan", hint: "Anak harus merapikan mainannya agar rumah tetap rapi.", alt: ["permainan"] }
        ];

        const container = document.getElementById('question-container');
        let currentSection = '';

        function render() {
            let html = '';
            questions.forEach((q, idx) => {
                if (q.section && q.section !== currentSection) {
                    currentSection = q.section;
                    html += `<div class="section-title">${q.section}</div>`;
                }
                html += `<div class="question-item">
                    <div class="q-text"><span class="q-number">${idx + 1}</span>${q.text}</div>
                    <input type="text" class="input-text" name="q${q.id}" placeholder="Tulis jawaban di sini..." autocomplete="off">
                    <div class="feedback-box" id="fb-${q.id}"></div>
                </div>`;
            });
            container.innerHTML = html;
        }

        function updateProgress() {
            let answered = 0;
            questions.forEach(q => {
                const el = document.querySelector(`[name="q${q.id}"]`);
                if (el && el.value.trim()) answered++;
            });
            document.getElementById('progress-fill').style.width = `${(answered / questions.length) * 100}%`;
        }

        document.addEventListener('input', updateProgress);

        function normalize(s) { return s.toLowerCase().replace(/[-_.,]/g, '').trim(); }

        function submitExam() {
            let score = 0;
            questions.forEach(q => {
                const fb = document.getElementById(`fb-${q.id}`);
                const val = normalize(document.querySelector(`[name="q${q.id}"]`).value);
                const ans = normalize(q.answer);
                let isCorrect = val === ans || val.includes(ans) || (ans.includes(val) && val.length > 2);
                if (q.alt) { q.alt.forEach(a => { if (normalize(a) === val || val.includes(normalize(a))) isCorrect = true; }); }
                if (isCorrect) { score++; fb.className = 'feedback-box correct'; fb.innerHTML = '✅ Benar!'; }
                else { fb.className = 'feedback-box wrong'; fb.innerHTML = `❌ Jawaban: <b>${q.answer}</b>. ${q.hint}`; }
                fb.style.display = 'block';
            });
            const pct = Math.round((score / questions.length) * 100);
            document.getElementById('final-score').innerText = pct;
            document.getElementById('score-board').style.display = 'block';
            document.getElementById('footer-action').style.display = 'none';
            document.getElementById('progress-fill').style.width = '100%';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        render();
    </script>
</body>

</html>
