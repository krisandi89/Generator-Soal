<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>STS PAI Kelas 2 - SDIT Friends</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #27ae60; --primary-light: #2ecc71; --bg: #eafaf1; --success: #27ae60; --error: #e74c3c; --warning: #f39c12; --card-bg: #ffffff; --text: #2d3436; --border: #dfe6e9; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); padding: 0; min-height: 100vh; }
        .container { max-width: 850px; margin: 0 auto; background: var(--card-bg); border-radius: 0 0 20px 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); overflow: hidden; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; padding: 30px; text-align: center; position: relative; overflow: hidden; }
        .header::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%); animation: shimmer 8s infinite; }
        @keyframes shimmer { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(180deg); } }
        .header h1 { margin: 0; font-size: 2em; font-weight: 800; position: relative; z-index: 1; }
        .header p { margin-top: 5px; opacity: 0.9; font-size: 1em; position: relative; z-index: 1; }
        .header .badge { display: inline-block; background: rgba(255,255,255,0.2); padding: 4px 14px; border-radius: 20px; font-size: 0.8em; margin-top: 8px; position: relative; z-index: 1; }
        .progress-bar { height: 6px; background: var(--border); position: sticky; top: 0; z-index: 100; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--success), #58d68d); width: 0%; transition: width 0.5s ease; border-radius: 0 3px 3px 0; }
        .score-board { text-align: center; padding: 30px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; display: none; margin-bottom: 20px; border-radius: 0 0 20px 20px; animation: slideDown 0.6s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        .score-board h2 { font-size: 1.3em; margin-bottom: 5px; }
        .score-value { font-size: 4em; font-weight: 800; margin: 10px 0; }
        .score-detail { font-size: 0.95em; opacity: 0.9; margin-bottom: 5px; }
        .back-btn { display: inline-block; margin-top: 15px; padding: 10px 25px; background: rgba(255,255,255,0.2); color: white; text-decoration: none; border-radius: 25px; font-weight: 700; transition: all 0.3s; border: 2px solid rgba(255,255,255,0.4); }
        .back-btn:hover { background: rgba(255,255,255,0.3); }
        .question-list { padding: 25px; }
        .section-title { font-size: 1em; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: white; margin: 30px 0 15px; padding: 12px 18px; background: linear-gradient(135deg, var(--primary), var(--primary-light)); border-radius: 12px; }
        .info-tag { display: inline-block; background: rgba(255,255,255,0.25); padding: 2px 10px; border-radius: 20px; font-size: 0.75em; margin-left: 8px; }
        .question-item { margin-bottom: 22px; padding: 20px; border-radius: 12px; border: 2px solid var(--border); background: #fafbfc; transition: all 0.3s; }
        .question-item:hover { border-color: var(--primary); box-shadow: 0 4px 15px rgba(39,174,96,0.1); }
        .q-number { display: inline-flex; align-items: center; justify-content: center; background: var(--primary); color: white; width: 32px; height: 32px; border-radius: 50%; font-size: 0.85em; font-weight: 800; margin-right: 10px; flex-shrink: 0; }
        .q-text { font-size: 1em; line-height: 1.7; margin-bottom: 14px; display: flex; align-items: flex-start; }
        .q-text-content { flex: 1; }
        .options { display: flex; flex-direction: column; gap: 10px; }
        .option-label { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 10px; border: 2px solid var(--border); cursor: pointer; transition: all 0.2s; font-size: 0.95em; }
        .option-label:hover { border-color: var(--primary); background: #eafaf1; }
        .option-label input[type="radio"] { width: 18px; height: 18px; accent-color: var(--primary); flex-shrink: 0; }
        .option-label.correct-opt { border-color: var(--success) !important; background: #d4edda !important; }
        .option-label.wrong-opt { border-color: var(--error) !important; background: #f8d7da !important; }
        .bs-options { display: flex; gap: 12px; margin-top: 5px; }
        .bs-btn { flex: 1; padding: 12px; border: 2px solid var(--border); border-radius: 10px; background: white; cursor: pointer; font-family: 'Nunito', sans-serif; font-size: 1em; font-weight: 700; transition: all 0.2s; }
        .bs-btn:hover { border-color: var(--primary); background: #eafaf1; }
        .bs-btn.selected-benar { border-color: var(--success); background: #d4edda; color: #155724; }
        .bs-btn.selected-salah { border-color: var(--error); background: #f8d7da; color: #721c24; }
        .match-select { width: 100%; padding: 10px 14px; border: 2px solid var(--border); border-radius: 10px; font-family: 'Nunito', sans-serif; font-size: 0.9em; background: white; cursor: pointer; font-weight: 600; }
        .match-select:focus { outline: none; border-color: var(--primary); }
        .input-text { width: 100%; padding: 12px 15px; border: 2px solid var(--border); border-radius: 10px; font-size: 1em; font-family: 'Nunito', sans-serif; transition: border 0.3s; }
        .input-text:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(39,174,96,0.15); }
        textarea.input-text { resize: vertical; min-height: 90px; }
        .feedback-box { margin-top: 12px; padding: 12px 15px; border-radius: 10px; display: none; font-size: 0.9em; font-weight: 600; }
        .correct { background: #d4edda; color: #155724; border-left: 4px solid var(--success); }
        .wrong { background: #f8d7da; color: #721c24; border-left: 4px solid var(--error); }
        .partial { background: #fff3cd; color: #856404; border-left: 4px solid var(--warning); }
        .footer-action { background: var(--card-bg); padding: 20px; text-align: center; position: sticky; bottom: 0; border-top: 2px solid var(--border); }
        .btn-submit { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; border: none; padding: 15px 50px; font-size: 1.1em; border-radius: 50px; cursor: pointer; font-weight: 800; transition: all 0.3s; }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(39,174,96,0.4); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🌙 PAI & Budi Pekerti</h1>
            <p>SDIT Friends — Kelas 2</p>
            <div class="badge">Sumatif Tengah Semester (STS)</div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="score-board" id="score-board">
            <h2>📊 Nilai Kamu</h2>
            <div class="score-value" id="final-score">0</div>
            <div class="score-detail" id="score-detail"></div>
            <a href="kelas2.html" class="back-btn">⬅ Kembali ke Menu Kelas 2</a>
        </div>
        <div class="question-list" id="question-container"></div>
        <div class="footer-action" id="footer-action">
            <button class="btn-submit" onclick="submitExam()">Kumpulkan Jawaban ✅</button>
        </div>
    </div>
    <script>
    const pgQuestions = [
        { id: 'pg1', text: 'Hadis tentang kebersihan menyebutkan bahwa kebersihan adalah sebagian dari ...', options: ['A. Ibadah', 'B. Iman', 'C. Islam', 'D. Ihsan'], answer: 'B' },
        { id: 'pg2', text: 'Umat Islam diperintahkan untuk selalu menjaga ...', options: ['A. Kesenangan', 'B. Kebersihan', 'C. Keramaian', 'D. Keindahan'], answer: 'B' },
        { id: 'pg3', text: 'Malaikat yang bertugas mencatat amal baik manusia adalah ...', options: ['A. Malaikat Izrail', 'B. Malaikat Mikail', 'C. Malaikat Raqib', 'D. Malaikat Atid'], answer: 'C' },
        { id: 'pg4', text: 'Malaikat yang bertugas mencatat amal buruk manusia adalah ...', options: ['A. Malaikat Raqib', 'B. Malaikat Atid', 'C. Malaikat Jibril', 'D. Malaikat Munkar'], answer: 'B' },
        { id: 'pg5', text: 'Sifat rendah hati artinya tidak ...', options: ['A. Sombong', 'B. Malas', 'C. Rakus', 'D. Pendiam'], answer: 'A' },
        { id: 'pg6', text: 'Mandi dua kali sehari dilakukan pada waktu ...', options: ['A. Pagi dan Siang', 'B. Siang dan Malam', 'C. Pagi dan Sore/Malam', 'D. Sore dan Malam'], answer: 'C' },
        { id: 'pg7', text: 'Pakaian yang kotor sebaiknya segera ...', options: ['A. Dibuang', 'B. Dibiarkan', 'C. Dicuci', 'D. Disimpan'], answer: 'C' },
        { id: 'pg8', text: 'Jumlah malaikat yang wajib kita ketahui ada ...', options: ['A. 5', 'B. 10', 'C. 15', 'D. 20'], answer: 'B' },
        { id: 'pg9', text: 'Orang yang sombong tidak disukai oleh Allah. Lawan dari sombong adalah ...', options: ['A. Pemarah', 'B. Rendah hati', 'C. Pemalu', 'D. Pendiam'], answer: 'B' },
        { id: 'pg10', text: 'Malaikat diciptakan oleh Allah dari ...', options: ['A. Api', 'B. Tanah', 'C. Cahaya / Nur', 'D. Air'], answer: 'C' },
    ];
    const bsQuestions = [
        { id: 'bs1', text: 'Kebersihan adalah sebagian dari iman.', answer: 'Benar' },
        { id: 'bs2', text: 'Malaikat Raqib bertugas mencatat amal buruk manusia.', answer: 'Salah' },
        { id: 'bs3', text: 'Sifat sombong adalah sifat yang disukai Allah SWT.', answer: 'Salah' },
        { id: 'bs4', text: 'Malaikat tidak pernah bermaksiat kepada Allah SWT.', answer: 'Benar' },
        { id: 'bs5', text: 'Membersihkan pakaian merupakan salah satu bagian dari menjaga kebersihan.', answer: 'Benar' },
    ];
    const matchQuestions = [
        { id: 'mt1', left: 'Malaikat Jibril', options: ['Menyampaikan wahyu', 'Mencabut nyawa', 'Mencatat amal baik', 'Menjaga surga'], answer: 'Menyampaikan wahyu' },
        { id: 'mt2', left: 'Malaikat Izrail', options: ['Menyampaikan wahyu', 'Mencabut nyawa', 'Mencatat amal baik', 'Membagi rezeki'], answer: 'Mencabut nyawa' },
        { id: 'mt3', left: 'Malaikat Mikail', options: ['Menyampaikan wahyu', 'Mencabut nyawa', 'Membagi rezeki', 'Menjaga neraka'], answer: 'Membagi rezeki' },
        { id: 'mt4', left: 'Malaikat Raqib', options: ['Menjaga surga', 'Mencatat amal baik', 'Mencatat amal buruk', 'Membagi rezeki'], answer: 'Mencatat amal baik' },
        { id: 'mt5', left: 'Malaikat Atid', options: ['Menjaga surga', 'Mencatat amal baik', 'Mencatat amal buruk', 'Menyampaikan wahyu'], answer: 'Mencatat amal buruk' },
    ];
    const isianQuestions = [
        { id: 'is1', text: 'Kebersihan adalah sebagian dari ...', answer: 'Iman', alt: ['iman'] },
        { id: 'is2', text: 'Malaikat yang menyampaikan wahyu kepada para nabi adalah Malaikat ...', answer: 'Jibril', alt: ['jibril'] },
        { id: 'is3', text: 'Sifat tidak sombong dan tidak angkuh disebut sifat ...', answer: 'Rendah hati', alt: ['rendahhati', 'tawadhu', 'tawadu'] },
        { id: 'is4', text: 'Malaikat diciptakan Allah dari ...', answer: 'Cahaya', alt: ['nur', 'cahaya/nur'] },
        { id: 'is5', text: 'Malaikat yang bertugas mencabut nyawa adalah Malaikat ...', answer: 'Izrail', alt: ['izrail', 'azrail'] },
    ];
    const uraianQuestions = [
        { id: 'ur1', text: 'Sebutkan 3 cara menjaga kebersihan tubuh sesuai ajaran Islam!' },
        { id: 'ur2', text: 'Sebutkan 5 nama malaikat beserta tugasnya masing-masing!' },
        { id: 'ur3', text: 'Apa yang dimaksud dengan sifat rendah hati? Berikan 2 contoh perilaku rendah hati dalam kehidupan sehari-hari!' },
        { id: 'ur4', text: 'Mengapa kita harus menjaga kebersihan? Jelaskan menurut pemahamanmu!' },
        { id: 'ur5', text: 'Apa perbedaan antara Malaikat Raqib dan Malaikat Atid? Jelaskan tugasnya!' },
    ];

    const totalQ = pgQuestions.length + bsQuestions.length + matchQuestions.length + isianQuestions.length + uraianQuestions.length;
    const scoredQ = pgQuestions.length + bsQuestions.length + matchQuestions.length + isianQuestions.length;

    function render() {
        let html = ''; let qNum = 1;
        html += `<div class="section-title">📝 Pilihan Ganda <span class="info-tag">10 soal × 1 poin</span></div>`;
        pgQuestions.forEach(q => {
            html += `<div class="question-item" id="item-${q.id}"><div class="q-text"><span class="q-number">${qNum++}</span><span class="q-text-content">${q.text}</span></div><div class="options">`;
            q.options.forEach(opt => { const val = opt.charAt(0); html += `<label class="option-label" id="opt-${q.id}-${val}"><input type="radio" name="${q.id}" value="${val}" onchange="onRadioChange('${q.id}','${val}')"> ${opt}</label>`; });
            html += `</div><div class="feedback-box" id="fb-${q.id}"></div></div>`;
        });
        html += `<div class="section-title">✔️ Benar atau Salah <span class="info-tag">5 soal × 1 poin</span></div>`;
        bsQuestions.forEach(q => {
            html += `<div class="question-item" id="item-${q.id}"><div class="q-text"><span class="q-number">${qNum++}</span><span class="q-text-content">${q.text}</span></div><div class="bs-options"><button class="bs-btn" id="bs-benar-${q.id}" onclick="selectBS('${q.id}','Benar')">✅ Benar</button><button class="bs-btn" id="bs-salah-${q.id}" onclick="selectBS('${q.id}','Salah')">❌ Salah</button></div><input type="hidden" id="${q.id}" value=""><div class="feedback-box" id="fb-${q.id}"></div></div>`;
        });
        html += `<div class="section-title">🔗 Tarik Garis (Pasangkan) <span class="info-tag">5 soal × 1 poin</span></div>`;
        matchQuestions.forEach(q => {
            let shuffled = [...q.options].sort(() => Math.random() - 0.5);
            html += `<div class="question-item" id="item-${q.id}"><div class="q-text"><span class="q-number">${qNum++}</span><span class="q-text-content">Pasangkan: <b>${q.left}</b> dengan tugasnya yang tepat!</span></div><select class="match-select" id="${q.id}"><option value="">-- Pilih Jawaban --</option>${shuffled.map(o=>`<option value="${o}">${o}</option>`).join('')}</select><div class="feedback-box" id="fb-${q.id}"></div></div>`;
        });
        html += `<div class="section-title">✏️ Isian Singkat <span class="info-tag">5 soal × 1 poin</span></div>`;
        isianQuestions.forEach(q => {
            html += `<div class="question-item" id="item-${q.id}"><div class="q-text"><span class="q-number">${qNum++}</span><span class="q-text-content">${q.text}</span></div><input type="text" class="input-text" id="${q.id}" placeholder="Tulis jawaban di sini..." autocomplete="off"><div class="feedback-box" id="fb-${q.id}"></div></div>`;
        });
        html += `<div class="section-title">📄 Uraian <span class="info-tag">5 soal — dijawab lengkap</span></div>`;
        uraianQuestions.forEach(q => {
            html += `<div class="question-item" id="item-${q.id}"><div class="q-text"><span class="q-number">${qNum++}</span><span class="q-text-content">${q.text}</span></div><textarea class="input-text" id="${q.id}" placeholder="Tulis jawaban lengkap di sini..."></textarea><div class="feedback-box" id="fb-${q.id}"></div></div>`;
        });
        document.getElementById('question-container').innerHTML = html;
        document.addEventListener('input', updateProgress);
        document.addEventListener('change', updateProgress);
    }

    function onRadioChange(qId, val) {
        const q = pgQuestions.find(x => x.id === qId);
        if (!q) return;
        q.options.map(o => o.charAt(0)).forEach(v => document.getElementById(`opt-${qId}-${v}`)?.classList.remove('selected'));
        document.getElementById(`opt-${qId}-${val}`)?.classList.add('selected');
        updateProgress();
    }
    function selectBS(qId, val) {
        document.getElementById(`bs-benar-${qId}`).classList.remove('selected-benar');
        document.getElementById(`bs-salah-${qId}`).classList.remove('selected-salah');
        document.getElementById(qId).value = val;
        val === 'Benar' ? document.getElementById(`bs-benar-${qId}`).classList.add('selected-benar') : document.getElementById(`bs-salah-${qId}`).classList.add('selected-salah');
        updateProgress();
    }
    function updateProgress() {
        let answered = 0;
        pgQuestions.forEach(q => { if (document.querySelector(`[name="${q.id}"]:checked`)) answered++; });
        bsQuestions.forEach(q => { if (document.getElementById(q.id)?.value) answered++; });
        matchQuestions.forEach(q => { if (document.getElementById(q.id)?.value) answered++; });
        isianQuestions.forEach(q => { if (document.getElementById(q.id)?.value?.trim()) answered++; });
        uraianQuestions.forEach(q => { if (document.getElementById(q.id)?.value?.trim()) answered++; });
        document.getElementById('progress-fill').style.width = `${(answered / totalQ) * 100}%`;
    }
    function normalize(s) { return s.toLowerCase().replace(/[-_.,!?']/g, '').trim(); }
    function submitExam() {
        let score = 0;
        pgQuestions.forEach(q => {
            const sel = document.querySelector(`[name="${q.id}"]:checked`); const fb = document.getElementById(`fb-${q.id}`);
            q.options.map(o => o.charAt(0)).forEach(v => { const lbl = document.getElementById(`opt-${q.id}-${v}`); if (lbl) lbl.classList.remove('correct-opt','wrong-opt'); });
            const cl = document.getElementById(`opt-${q.id}-${q.answer}`); if (cl) cl.classList.add('correct-opt');
            if (sel && sel.value !== q.answer) { const wl = document.getElementById(`opt-${q.id}-${sel.value}`); if (wl) wl.classList.add('wrong-opt'); }
            const ok = sel && sel.value === q.answer;
            if (ok) { score++; fb.className='feedback-box correct'; fb.innerHTML='✅ Benar!'; }
            else { fb.className='feedback-box wrong'; fb.innerHTML=`❌ Jawaban yang benar: <b>${q.answer}</b>`; }
            fb.style.display='block';
        });
        bsQuestions.forEach(q => {
            const val = document.getElementById(q.id)?.value; const fb = document.getElementById(`fb-${q.id}`);
            if (val === q.answer) { score++; fb.className='feedback-box correct'; fb.innerHTML='✅ Benar!'; }
            else { fb.className='feedback-box wrong'; fb.innerHTML=`❌ Jawaban yang benar: <b>${q.answer}</b>`; }
            fb.style.display='block';
        });
        matchQuestions.forEach(q => {
            const val = document.getElementById(q.id)?.value; const fb = document.getElementById(`fb-${q.id}`);
            if (normalize(val) === normalize(q.answer)) { score++; fb.className='feedback-box correct'; fb.innerHTML='✅ Benar!'; }
            else { fb.className='feedback-box wrong'; fb.innerHTML=`❌ Pasangan: <b>${q.answer}</b>`; }
            fb.style.display='block';
        });
        isianQuestions.forEach(q => {
            const val = normalize(document.getElementById(q.id)?.value || ''); const fb = document.getElementById(`fb-${q.id}`);
            const ans = normalize(q.answer);
            let ok = val === ans || val.includes(ans) || (ans.includes(val) && val.length > 2);
            if (q.alt) q.alt.forEach(a => { if (normalize(a) === val || val.includes(normalize(a))) ok = true; });
            if (ok) { score++; fb.className='feedback-box correct'; fb.innerHTML='✅ Benar!'; }
            else { fb.className='feedback-box wrong'; fb.innerHTML=`❌ Jawaban: <b>${q.answer}</b>`; }
            fb.style.display='block';
        });
        uraianQuestions.forEach(q => {
            const val = document.getElementById(q.id)?.value?.trim(); const fb = document.getElementById(`fb-${q.id}`);
            fb.className='feedback-box partial'; fb.innerHTML = val ? '📝 Jawaban kamu sudah dicatat. Penilaian oleh guru.' : '⚠️ Belum dijawab.'; fb.style.display='block';
        });
        const pct = Math.round((score / scoredQ) * 100);
        document.getElementById('final-score').innerText = pct;
        document.getElementById('score-detail').innerText = `Skor: ${score} dari ${scoredQ} soal yang dinilai otomatis`;
        document.getElementById('score-board').style.display='block';
        document.getElementById('footer-action').style.display='none';
        document.getElementById('progress-fill').style.width='100%';
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
    render();
    </script>
</body>
</html>
