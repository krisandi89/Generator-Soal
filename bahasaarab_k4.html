<!DOCTYPE html>
<html lang="ar" dir="ltr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian Bahasa Arab Kelas 4 - SD Dilaraf</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1a5276;
            --primary-light: #2980b9;
            --bg: #eaf2f8;
            --success: #27ae60;
            --error: #e74c3c;
            --warning: #f39c12;
            --card-bg: #fff;
            --text: #2d3436;
            --border: #dfe6e9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 0 0 20px 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 60%);
            animation: shimmer 8s infinite;
        }

        @keyframes shimmer {

            0%,
            100% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(180deg);
            }
        }

        .header h1 {
            font-size: 2em;
            font-weight: 800;
            position: relative;
            z-index: 1;
        }

        .header .arabic-title {
            font-family: 'Amiri', serif;
            font-size: 1.6em;
            margin-top: 5px;
            position: relative;
            z-index: 1;
            direction: rtl;
        }

        .header p {
            margin-top: 5px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .header .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-top: 8px;
            position: relative;
            z-index: 1;
        }

        .progress-bar {
            height: 6px;
            background: var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), #2ecc71);
            width: 0%;
            transition: width 0.5s ease;
        }

        .score-board {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            display: none;
        }

        .score-value {
            font-size: 4em;
            font-weight: 800;
            margin: 10px 0;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 700;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .question-list {
            padding: 25px;
        }

        .section-title {
            font-size: 0.85em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
            margin: 30px 0 15px;
            padding: 10px 15px;
            background: var(--bg);
            border-radius: 10px;
            border-left: 4px solid var(--primary);
        }

        .question-item {
            margin-bottom: 25px;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: #fafbfc;
            transition: all 0.3s;
        }

        .question-item:hover {
            border-color: var(--primary-light);
            box-shadow: 0 4px 15px rgba(26, 82, 118, 0.1);
        }

        .q-number {
            display: inline-block;
            background: var(--primary);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            text-align: center;
            line-height: 32px;
            font-size: 0.85em;
            font-weight: 800;
            margin-right: 10px;
        }

        .q-text {
            font-size: 1em;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .arabic {
            font-family: 'Amiri', serif;
            font-size: 1.4em;
            direction: rtl;
            text-align: right;
            color: var(--primary);
            line-height: 2;
            background: #f0f8ff;
            padding: 10px 15px;
            border-radius: 8px;
            margin: 8px 0;
            border: 1px solid #d4e6f1;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-label,
        .checkbox-label {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: white;
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95em;
        }

        .radio-label:hover,
        .checkbox-label:hover {
            background: #eaf2f8;
            border-color: var(--primary-light);
            transform: translateX(5px);
        }

        .radio-label .arabic-opt,
        .checkbox-label .arabic-opt {
            font-family: 'Amiri', serif;
            font-size: 1.2em;
            direction: rtl;
            margin-left: 5px;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 12px;
            transform: scale(1.3);
            accent-color: var(--primary);
        }

        .input-text {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1em;
            font-family: 'Nunito', sans-serif;
        }

        .input-text:focus {
            outline: none;
            border-color: var(--primary);
        }

        textarea.input-text {
            min-height: 80px;
            resize: vertical;
        }

        .feedback-box {
            margin-top: 12px;
            padding: 12px 15px;
            border-radius: 10px;
            display: none;
            font-size: 0.9em;
            font-weight: 600;
        }

        .correct {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid var(--success);
        }

        .wrong {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid var(--error);
        }

        .manual {
            background: #fff3cd;
            color: #856404;
            border-left: 4px solid var(--warning);
        }

        .footer-action {
            background: var(--card-bg);
            padding: 20px;
            text-align: center;
            position: sticky;
            bottom: 0;
            border-top: 2px solid var(--border);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            box-shadow: 0 4px 15px rgba(26, 82, 118, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.5em;
            }

            .question-list {
                padding: 15px;
            }

            .arabic {
                font-size: 1.2em;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🕌 Bahasa Arab</h1>
            <div class="arabic-title">اللُّغَةُ العَرَبِيَّةُ</div>
            <p>SD DILARAF ISLAMIC SCHOOL — Kelas 4 Al-Muhaimin</p>
            <div class="badge">ASTS Semester 2 • 2025/2026</div>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="score-board" id="score-board">
            <h2>📊 Hasil Ujian</h2>
            <div class="score-value" id="final-score">0</div>
            <p class="detail" id="score-detail"></p>
            <a href="kelas4.html" class="back-btn">⬅ Kembali ke Menu Kelas 4</a>
        </div>
        <div class="question-list" id="question-container"></div>
        <div class="footer-action" id="footer-action">
            <button class="btn-submit" onclick="submitExam()">Kumpulkan ✅</button>
        </div>
    </div>
    <script>
        const questions = [
            // ===== PILIHAN GANDA (No 1-10) =====
            { id: 1, type: "pg", section: "Pilihan Ganda — أَسْئِلَةُ الاِخْتِيَار", text: 'Apa arti kosakata berikut? <div class="arabic">أَبٌ</div>', options: ["Ibu", "Ayah", "Kakak laki-laki", "Paman"], answer: 1, hint: "أَبٌ (abun) artinya Ayah." },
            { id: 2, type: "pg", text: 'Gambar seorang perempuan dewasa yang menggendong bayi. Kosakata bahasa Arab yang tepat untuk gambar tersebut adalah...', options: ['<span class="arabic-opt">أُمٌّ</span> (Ibu)', '<span class="arabic-opt">أُخْتٌ</span> (Kakak perempuan)', '<span class="arabic-opt">بِنْتٌ</span> (Anak perempuan)', '<span class="arabic-opt">جَدَّةٌ</span> (Nenek)'], answer: 0, hint: 'أُمٌّ (ummun) artinya Ibu.' },
            { id: 3, type: "pg", text: 'Apa arti kosakata berikut? <div class="arabic">أَخٌ</div>', options: ["Kakak perempuan", "Adik", "Kakak laki-laki / Saudara laki-laki", "Paman"], answer: 2, hint: "أَخٌ (akhun) artinya kakak laki-laki / saudara laki-laki." },
            { id: 4, type: "pg", text: 'Kosakata bahasa Arab untuk "kakak perempuan" adalah...', options: ['<span class="arabic-opt">أَخٌ</span>', '<span class="arabic-opt">أُخْتٌ</span>', '<span class="arabic-opt">أُمٌّ</span>', '<span class="arabic-opt">بِنْتٌ</span>'], answer: 1, hint: 'أُخْتٌ (ukhtun) artinya kakak/saudara perempuan.' },
            { id: 5, type: "pg", text: 'Apa arti kosakata berikut? <div class="arabic">بَيْتٌ</div>', options: ["Sekolah", "Masjid", "Rumah", "Taman"], answer: 2, hint: "بَيْتٌ (baitun) artinya rumah." },
            { id: 6, type: "pg", text: 'Kosakata bahasa Arab untuk "anak laki-laki" adalah...', options: ['<span class="arabic-opt">بِنْتٌ</span>', '<span class="arabic-opt">وَلَدٌ</span>', '<span class="arabic-opt">أَبٌ</span>', '<span class="arabic-opt">عَمٌّ</span>'], answer: 1, hint: 'وَلَدٌ (waladun) artinya anak laki-laki.' },
            { id: 7, type: "pg", text: 'Kata ganti orang bersambung (الضَّمِيرُ المُتَّصِلُ) digunakan untuk... <div class="arabic">الضَّمِيرُ المُتَّصِلُ</div>', options: ["Mengganti nama benda", "Mengganti kata ganti orang yang melekat pada kata lain", "Mengganti kata kerja", "Mengganti kata sifat"], answer: 1, hint: "الضَّمِيرُ المُتَّصِلُ adalah kata ganti orang yang melekat/bersambung pada kata lain." },
            { id: 8, type: "pg", text: 'Apa arti dari الضَّمِيرُ المُتَّصِلُ berikut? <div class="arabic">ـهُ</div>', options: ["Milik saya", "Milik kamu (lk)", "Milik dia (lk)", "Milik mereka"], answer: 2, hint: 'ـهُ (-hu) artinya milik dia (laki-laki). Contoh: كِتَابُهُ = bukunya.' },
            { id: 9, type: "pg", text: 'Apa arti dari الضَّمِيرُ المُتَّصِلُ berikut? <div class="arabic">ـهَا</div>', options: ["Milik saya", "Milik kamu (pr)", "Milik dia (pr)", "Milik kalian"], answer: 2, hint: 'ـهَا (-hā) artinya milik dia (perempuan).' },
            { id: 10, type: "pg", text: 'Apa arti dari الضَّمِيرُ المُتَّصِلُ berikut? <div class="arabic">ـِي</div>', options: ["Milik saya", "Milik kamu", "Milik dia", "Milik kami"], answer: 0, hint: 'ـِي (-ī) artinya milik saya. Contoh: كِتَابِي = buku saya.' },

            // ===== PG KOMPLEKS (No 11-20) =====
            { id: 11, type: "pg_kompleks", section: "Pilihan Ganda Kompleks", text: 'Kosakata yang termasuk anggota keluarga (أُسْرَة) adalah... (pilih semua yang benar)', options: ['<span class="arabic-opt">أَبٌ</span> (Ayah)', '<span class="arabic-opt">أُمٌّ</span> (Ibu)', '<span class="arabic-opt">مَدْرَسَةٌ</span> (Sekolah)', '<span class="arabic-opt">أَخٌ</span> (Saudara lk)'], answer: [0, 1, 3], hint: 'مَدْرَسَةٌ (madrasatun) artinya sekolah, bukan anggota keluarga.' },
            { id: 12, type: "pg_kompleks", text: 'Kosakata yang termasuk anggota keluarga (أُسْرَة) adalah... (pilih semua yang benar)', options: ['<span class="arabic-opt">أُخْتٌ</span> (Saudara pr)', '<span class="arabic-opt">جَدٌّ</span> (Kakek)', '<span class="arabic-opt">كُرْسِيٌّ</span> (Kursi)', '<span class="arabic-opt">جَدَّةٌ</span> (Nenek)'], answer: [0, 1, 3], hint: 'كُرْسِيٌّ (kursiyyun) artinya kursi, bukan anggota keluarga.' },
            { id: 13, type: "pg_kompleks", text: 'Kosakata anggota keluarga yang tepat sesuai gambar sebuah keluarga besar (kakek, nenek, ayah, ibu, anak) adalah... (pilih semua yang benar)', options: ['<span class="arabic-opt">جَدٌّ</span> (Kakek)', '<span class="arabic-opt">جَدَّةٌ</span> (Nenek)', '<span class="arabic-opt">قَلَمٌ</span> (Pensil)', '<span class="arabic-opt">وَلَدٌ</span> (Anak lk)'], answer: [0, 1, 3], hint: 'قَلَمٌ (qalamun) artinya pensil, bukan anggota keluarga.' },
            { id: 14, type: "pg_kompleks", text: 'Gambar anggota keluarga: ayah, ibu, dan anak-anak. Kosakata yang sesuai adalah... (pilih semua yang benar)', options: ['<span class="arabic-opt">أَبٌ</span> (Ayah)', '<span class="arabic-opt">أُمٌّ</span> (Ibu)', '<span class="arabic-opt">وَلَدٌ</span> (Anak lk)', '<span class="arabic-opt">سَيَّارَةٌ</span> (Mobil)'], answer: [0, 1, 2], hint: 'سَيَّارَةٌ (sayyāratun) artinya mobil, bukan anggota keluarga.' },
            { id: 15, type: "pg_kompleks", text: 'Gambar keluarga dengan kakek, nenek, paman, dan bibi. Kosakata yang sesuai adalah... (pilih semua yang benar)', options: ['<span class="arabic-opt">جَدٌّ</span> (Kakek)', '<span class="arabic-opt">عَمٌّ</span> (Paman)', '<span class="arabic-opt">عَمَّةٌ</span> (Bibi)', '<span class="arabic-opt">بَابٌ</span> (Pintu)'], answer: [0, 1, 2], hint: 'بَابٌ (bābun) artinya pintu, bukan anggota keluarga.' },
            { id: 16, type: "pg_kompleks", text: 'Kosakata yang termasuk benda di rumah (فِي البَيْتِ) adalah... (pilih semua yang benar)', options: ['<span class="arabic-opt">بَابٌ</span> (Pintu)', '<span class="arabic-opt">نَافِذَةٌ</span> (Jendela)', '<span class="arabic-opt">أَخٌ</span> (Saudara lk)', '<span class="arabic-opt">كُرْسِيٌّ</span> (Kursi)'], answer: [0, 1, 3], hint: 'أَخٌ (akhun) adalah anggota keluarga, bukan benda di rumah.' },
            { id: 17, type: "pg_kompleks", text: 'Kosakata yang termasuk benda di rumah (فِي البَيْتِ) adalah... (pilih semua yang benar)', options: ['<span class="arabic-opt">مَائِدَةٌ</span> (Meja makan)', '<span class="arabic-opt">سَرِيرٌ</span> (Tempat tidur)', '<span class="arabic-opt">جَدَّةٌ</span> (Nenek)', '<span class="arabic-opt">مِصْبَاحٌ</span> (Lampu)'], answer: [0, 1, 3], hint: 'جَدَّةٌ (jaddatun) adalah anggota keluarga, bukan benda.' },
            { id: 18, type: "pg_kompleks", text: 'Kosakata benda di rumah yang termasuk ke dalam ruang tidur adalah... (pilih semua yg benar)', options: ['<span class="arabic-opt">سَرِيرٌ</span> (Tempat tidur)', '<span class="arabic-opt">وِسَادَةٌ</span> (Bantal)', '<span class="arabic-opt">مَطْبَخٌ</span> (Dapur)', '<span class="arabic-opt">لِحَافٌ</span> (Selimut)'], answer: [0, 1, 3], hint: 'مَطْبَخٌ (mathbakhun) artinya dapur, yaitu nama ruangan, bukan benda di kamar tidur.' },
            { id: 19, type: "pg_kompleks", text: 'Kata yang BUKAN termasuk الضَّمِيرُ المُتَّصِلُ (kata ganti bersambung) adalah... (pilih semua yg benar)', options: ['<span class="arabic-opt">ـهُ</span>', '<span class="arabic-opt">كِتَابٌ</span>', '<span class="arabic-opt">ـكَ</span>', '<span class="arabic-opt">مَدْرَسَةٌ</span>'], answer: [1, 3], hint: 'كِتَابٌ (buku) dan مَدْرَسَةٌ (sekolah) adalah kata benda, bukan kata ganti bersambung.' },
            { id: 20, type: "pg_kompleks", text: 'Kosakata الضَّمِيرُ المُتَّصِلُ yang tepat adalah... (pilih semua yang benar)', options: ['<span class="arabic-opt">ـِي</span> (milik saya)', '<span class="arabic-opt">ـكَ</span> (milik kamu lk)', '<span class="arabic-opt">بَيْتٌ</span> (rumah)', '<span class="arabic-opt">ـهُ</span> (milik dia lk)'], answer: [0, 1, 3], hint: 'بَيْتٌ adalah kata benda (rumah), bukan kata ganti bersambung.' },

            // ===== BENAR / SALAH (No 21-30) =====
            { id: 21, type: "bs", section: "Benar / Salah", text: '<span class="arabic-opt">أَبٌ</span> artinya "Ayah" dalam bahasa Indonesia.', answer: "Benar", hint: 'أَبٌ (abun) berarti ayah.' },
            { id: 22, type: "bs", text: '<span class="arabic-opt">أُمٌّ</span> artinya "Kakak Perempuan" dalam bahasa Indonesia.', answer: "Salah", hint: 'أُمٌّ (ummun) artinya Ibu, bukan kakak perempuan. Kakak perempuan = أُخْتٌ.' },
            { id: 23, type: "bs", text: '<span class="arabic-opt">ـكَ</span> adalah kata ganti bersambung yang berarti "milik kamu (laki-laki)".', answer: "Benar", hint: 'ـكَ (-ka) artinya milik kamu (laki-laki). Contoh: كِتَابُكَ = bukumu.' },
            { id: 24, type: "bs", text: '<span class="arabic-opt">ـهَا</span> adalah kata ganti bersambung yang berarti "milik saya".', answer: "Salah", hint: 'ـهَا (-hā) artinya milik dia (perempuan), bukan milik saya. Milik saya = ـِي.' },
            { id: 25, type: "bs", text: '<span class="arabic-opt">بَابٌ</span> artinya "pintu" dan termasuk kosakata benda di rumah.', answer: "Benar", hint: 'بَابٌ (bābun) artinya pintu, termasuk benda yang ada di rumah.' },
            { id: 26, type: "bs", text: '<span class="arabic-opt">جَدٌّ</span> artinya "Kakek" dalam bahasa Indonesia.', answer: "Benar", hint: 'جَدٌّ (jaddun) artinya kakek.' },
            { id: 27, type: "bs", text: '<span class="arabic-opt">عَمَّةٌ</span> artinya "Paman" dalam bahasa Indonesia.', answer: "Salah", hint: 'عَمَّةٌ (ammatun) artinya bibi (saudara perempuan ayah). Paman = عَمٌّ.' },
            { id: 28, type: "bs", text: '<span class="arabic-opt">نَافِذَةٌ</span> artinya "Jendela" dan termasuk kosakata di rumah.', answer: "Benar", hint: 'نَافِذَةٌ (nāfidzatun) artinya jendela.' },
            { id: 29, type: "bs", text: '<span class="arabic-opt">مَائِدَةٌ</span> artinya "Tempat Tidur".', answer: "Salah", hint: 'مَائِدَةٌ (māidatun) artinya meja makan. Tempat tidur = سَرِيرٌ.' },
            { id: 30, type: "bs", text: '<span class="arabic-opt">مِصْبَاحٌ</span> artinya "Lampu" dan termasuk benda di rumah.', answer: "Benar", hint: 'مِصْبَاحٌ (misbāhun) artinya lampu.' },

            // ===== ISIAN (No 31-35) =====
            { id: 31, type: "isian", section: "Isian Singkat", text: 'Kosakata bahasa Arab untuk "Ayah" adalah... (tulis dalam huruf latin)', answer: "Abun", hint: 'أَبٌ dibaca Abun = Ayah.' },
            { id: 32, type: "isian", text: 'Kosakata bahasa Arab untuk "Ibu" adalah... (tulis dalam huruf latin)', answer: "Ummun", hint: 'أُمٌّ dibaca Ummun = Ibu.' },
            { id: 33, type: "isian", text: '<div class="arabic">أُخْتٌ</div> Kosakata di atas artinya... dalam bahasa Indonesia.', answer: "Kakak perempuan", hint: 'أُخْتٌ (ukhtun) artinya kakak/saudara perempuan.' },
            { id: 34, type: "isian", text: '<div class="arabic">بَيْتٌ</div> Kosakata di atas artinya... dalam bahasa Indonesia.', answer: "Rumah", hint: 'بَيْتٌ (baitun) artinya rumah.' },
            { id: 35, type: "isian", text: '<div class="arabic">كُرْسِيٌّ</div> Kosakata di atas artinya... dalam bahasa Indonesia.', answer: "Kursi", hint: 'كُرْسِيٌّ (kursiyyun) artinya kursi.' },

            // ===== URAIAN (No 36-40) =====
            { id: 36, type: "uraian", section: "Uraian / Esai", text: "Tuliskan 3 kosakata bahasa Arab tentang anggota keluarga beserta artinya!", answer: "1) أَبٌ (Abun) = Ayah, 2) أُمٌّ (Ummun) = Ibu, 3) أَخٌ (Akhun) = Saudara laki-laki, 4) أُخْتٌ (Ukhtun) = Saudara perempuan, 5) جَدٌّ (Jaddun) = Kakek", hint: "Sebutkan kosakata Arab, cara baca, dan artinya." },
            { id: 37, type: "uraian", text: "Tuliskan 3 kosakata bahasa Arab tentang anggota keluarga yang dimulai dari huruf Jim (ج)!", answer: "1) جَدٌّ (Jaddun) = Kakek, 2) جَدَّةٌ (Jaddatun) = Nenek", hint: 'Kosakata keluarga yang dimulai huruf ج: جَدٌّ dan جَدَّةٌ.' },
            { id: 38, type: "uraian", text: 'Jelaskan apa yang dimaksud dengan الضَّمِيرُ المُتَّصِلُ (kata ganti bersambung) dan berikan 3 contohnya!', answer: "الضَّمِيرُ المُتَّصِلُ adalah kata ganti orang yang melekat/bersambung pada kata lain. Contoh: 1) ـِي (milik saya) → كِتَابِي = buku saya, 2) ـكَ (milik kamu lk) → كِتَابُكَ = bukumu, 3) ـهُ (milik dia lk) → كِتَابُهُ = bukunya", hint: "Jelaskan pengertian dan berikan contoh penggunaannya." },
            { id: 39, type: "uraian", text: "Tuliskan 3 kosakata bahasa Arab tentang benda-benda yang ada di rumah beserta artinya!", answer: "1) بَابٌ (Bābun) = Pintu, 2) نَافِذَةٌ (Nāfidzatun) = Jendela, 3) كُرْسِيٌّ (Kursiyyun) = Kursi, 4) مَائِدَةٌ (Māidatun) = Meja makan, 5) سَرِيرٌ (Sarīrun) = Tempat tidur", hint: "Sebutkan kosakata Arab, cara baca, dan artinya." },
            { id: 40, type: "uraian", text: "Tuliskan kosakata bahasa Arab untuk ruangan-ruangan yang ada di rumah minimal 3!", answer: "1) غُرْفَةُ النَّوْمِ (Ghurfatun naum) = Kamar tidur, 2) مَطْبَخٌ (Mathbakhun) = Dapur, 3) حَمَّامٌ (Hammāmun) = Kamar mandi, 4) غُرْفَةُ الجُلُوسِ (Ghurfatul julūs) = Ruang tamu", hint: "Sebutkan nama-nama ruangan dalam bahasa Arab." }
        ];

        const container = document.getElementById('question-container');
        let currentSection = '';
        function render() {
            let html = '';
            questions.forEach((q, idx) => {
                if (q.section && q.section !== currentSection) { currentSection = q.section; html += `<div class="section-title">${q.section}</div>`; }
                let inputHtml = '';
                if (q.type === 'pg') { q.options.forEach((opt, i) => { inputHtml += `<label class="radio-label"><input type="radio" name="q${q.id}" value="${i}"> ${String.fromCharCode(65 + i)}. ${opt}</label>`; }); }
                else if (q.type === 'pg_kompleks') { q.options.forEach((opt, i) => { inputHtml += `<label class="checkbox-label"><input type="checkbox" name="q${q.id}" value="${i}"> ${String.fromCharCode(65 + i)}. ${opt}</label>`; }); }
                else if (q.type === 'bs') { inputHtml += `<label class="radio-label"><input type="radio" name="q${q.id}" value="Benar"> ✅ Benar</label><label class="radio-label"><input type="radio" name="q${q.id}" value="Salah"> ❌ Salah</label>`; }
                else if (q.type === 'isian') { inputHtml = `<input type="text" class="input-text" name="q${q.id}" placeholder="Tulis jawaban..." autocomplete="off">`; }
                else { inputHtml = `<textarea class="input-text" name="q${q.id}" placeholder="Tulis jawaban lengkap..." rows="3"></textarea>`; }
                html += `<div class="question-item"><div class="q-text"><span class="q-number">${idx + 1}</span>${q.text}</div><div class="options-group">${inputHtml}</div><div class="feedback-box" id="fb-${q.id}"></div></div>`;
            });
            container.innerHTML = html; updateProgress();
        }
        function updateProgress() { let a = 0; questions.forEach(q => { if (q.type === 'pg' || q.type === 'bs') { if (document.querySelector(`input[name="q${q.id}"]:checked`)) a++; } else if (q.type === 'pg_kompleks') { if (document.querySelectorAll(`input[name="q${q.id}"]:checked`).length > 0) a++; } else { const el = document.querySelector(`[name="q${q.id}"]`); if (el && el.value.trim()) a++; } }); document.getElementById('progress-fill').style.width = `${(a / questions.length) * 100}%`; }
        document.addEventListener('change', updateProgress); document.addEventListener('input', updateProgress);
        function submitExam() {
            let s = 0, m = 0;
            questions.forEach(q => {
                const fb = document.getElementById(`fb-${q.id}`);
                if (q.type === 'pg') { m++; const sel = document.querySelector(`input[name="q${q.id}"]:checked`); if (sel && parseInt(sel.value) === q.answer) { s++; fb.className = 'feedback-box correct'; fb.innerHTML = '✅ Benar!'; } else { fb.className = 'feedback-box wrong'; fb.innerHTML = `❌ Salah. ${q.hint}`; } }
                else if (q.type === 'pg_kompleks') { m++; const c = [...document.querySelectorAll(`input[name="q${q.id}"]:checked`)].map(x => parseInt(x.value)); if (c.length === q.answer.length && c.every(v => q.answer.includes(v))) { s++; fb.className = 'feedback-box correct'; fb.innerHTML = '✅ Benar!'; } else { fb.className = 'feedback-box wrong'; fb.innerHTML = `❌ Salah. ${q.hint}`; } }
                else if (q.type === 'bs') { m++; const sel = document.querySelector(`input[name="q${q.id}"]:checked`); if (sel && sel.value === q.answer) { s++; fb.className = 'feedback-box correct'; fb.innerHTML = '✅ Benar!'; } else { fb.className = 'feedback-box wrong'; fb.innerHTML = `❌ Salah. ${q.hint}`; } }
                else if (q.type === 'isian') { m++; const v = document.querySelector(`[name="q${q.id}"]`).value.trim().toLowerCase(); if (v === q.answer.toLowerCase()) { s++; fb.className = 'feedback-box correct'; fb.innerHTML = '✅ Benar!'; } else { fb.className = 'feedback-box wrong'; fb.innerHTML = `❌ Jawaban: <b>${q.answer}</b>. ${q.hint}`; } }
                else { fb.className = 'feedback-box manual'; fb.innerHTML = `📝 Periksa manual. Kunci: <b>${q.answer}</b>`; }
                fb.style.display = 'block';
            });
            document.getElementById('final-score').innerText = m > 0 ? Math.round((s / m) * 100) : 0;
            document.getElementById('score-detail').innerText = `Benar ${s} dari ${m} soal. Soal uraian diperiksa manual.`;
            document.getElementById('score-board').style.display = 'block'; document.getElementById('footer-action').style.display = 'none';
            document.getElementById('progress-fill').style.width = '100%'; window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        render();
    </script>
</body>
