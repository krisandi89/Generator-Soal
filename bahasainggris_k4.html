<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Exam Grade 4 - SD Dilaraf</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2c3e50;
            --primary-light: #34495e;
            --bg: #ecf0f1;
            --success: #27ae60;
            --error: #e74c3c;
            --warning: #f39c12;
            --card-bg: #fff;
            --text: #2d3436;
            --border: #dfe6e9;
            --accent: #e74c3c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 0 0 20px 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            padding: 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.1) 0%, transparent 60%);
            animation: shimmer 8s infinite;
        }

        @keyframes shimmer {

            0%,
            100% {
                transform: rotate(0deg);
            }

            50% {
                transform: rotate(180deg);
            }
        }

        .header h1 {
            font-size: 2em;
            font-weight: 800;
            position: relative;
            z-index: 1;
        }

        .header p {
            margin-top: 5px;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .header .badge {
            display: inline-block;
            background: rgba(255, 255, 255, 0.2);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.8em;
            margin-top: 8px;
            position: relative;
            z-index: 1;
        }

        .progress-bar {
            height: 6px;
            background: var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), #2ecc71);
            width: 0%;
            transition: width 0.5s ease;
        }

        .score-board {
            text-align: center;
            padding: 30px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            color: white;
            display: none;
        }

        .score-value {
            font-size: 4em;
            font-weight: 800;
            margin: 10px 0;
        }

        .back-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 700;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .question-list {
            padding: 25px;
        }

        .section-title {
            font-size: 0.85em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--primary);
            margin: 30px 0 15px;
            padding: 10px 15px;
            background: var(--bg);
            border-radius: 10px;
            border-left: 4px solid var(--accent);
        }

        .question-item {
            margin-bottom: 25px;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: #fafbfc;
            transition: all 0.3s;
        }

        .question-item:hover {
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.1);
        }

        .q-number {
            display: inline-block;
            background: var(--accent);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            text-align: center;
            line-height: 32px;
            font-size: 0.85em;
            font-weight: 800;
            margin-right: 10px;
        }

        .q-text {
            font-size: 1em;
            line-height: 1.7;
            margin-bottom: 12px;
        }

        .reading-box {
            background: #fef9e7;
            border: 2px solid #f9e79f;
            border-radius: 10px;
            padding: 15px;
            margin: 10px 0 15px;
            line-height: 1.8;
        }

        .clock-svg {
            text-align: center;
            margin: 10px 0;
        }

        .table-box {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0 15px;
            font-size: 0.9em;
        }

        .table-box th,
        .table-box td {
            border: 1px solid var(--border);
            padding: 8px 12px;
            text-align: left;
        }

        .table-box th {
            background: var(--primary);
            color: white;
        }

        .table-box tr:nth-child(even) {
            background: #f8f9fa;
        }

        .options-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .radio-label,
        .checkbox-label {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: white;
            border: 2px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95em;
        }

        .radio-label:hover,
        .checkbox-label:hover {
            background: #fdf2f0;
            border-color: var(--accent);
            transform: translateX(5px);
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 12px;
            transform: scale(1.3);
            accent-color: var(--accent);
        }

        .input-text {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 1em;
            font-family: 'Nunito', sans-serif;
        }

        .input-text:focus {
            outline: none;
            border-color: var(--accent);
        }

        textarea.input-text {
            min-height: 80px;
            resize: vertical;
        }

        .feedback-box {
            margin-top: 12px;
            padding: 12px 15px;
            border-radius: 10px;
            display: none;
            font-size: 0.9em;
            font-weight: 600;
        }

        .correct {
            background: #d4edda;
            color: #155724;
            border-left: 4px solid var(--success);
        }

        .wrong {
            background: #f8d7da;
            color: #721c24;
            border-left: 4px solid var(--error);
        }

        .manual {
            background: #fff3cd;
            color: #856404;
            border-left: 4px solid var(--warning);
        }

        .footer-action {
            background: var(--card-bg);
            padding: 20px;
            text-align: center;
            position: sticky;
            bottom: 0;
            border-top: 2px solid var(--border);
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--accent), #c0392b);
            color: white;
            border: none;
            padding: 15px 50px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 800;
            font-family: 'Nunito', sans-serif;
            box-shadow: 0 4px 15px rgba(231, 76, 60, 0.3);
        }

        .btn-submit:hover {
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 1.5em;
            }

            .question-list {
                padding: 15px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🌍 Bahasa Inggris</h1>
            <p>SD DILARAF ISLAMIC SCHOOL — Grade 4 Al-Muhaimin</p>
            <div class="badge">ASTS Semester 2 • 2025/2026</div>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="score-board" id="score-board">
            <h2>📊 Exam Result</h2>
            <div class="score-value" id="final-score">0</div>
            <p class="detail" id="score-detail"></p>
            <a href="kelas4.html" class="back-btn">⬅ Back to Grade 4 Menu</a>
        </div>
        <div class="question-list" id="question-container"></div>
        <div class="footer-action" id="footer-action">
            <button class="btn-submit" onclick="submitExam()">Submit ✅</button>
        </div>
    </div>
    <script>
        function clockSvg(h, m) {
            const ha = ((h % 12) * 30 + m * 0.5 - 90) * Math.PI / 180;
            const ma = (m * 6 - 90) * Math.PI / 180;
            const hx = 60 + 25 * Math.cos(ha), hy = 60 + 25 * Math.sin(ha);
            const mx = 60 + 35 * Math.cos(ma), my = 60 + 35 * Math.sin(ma);
            let nums = '';
            for (let i = 1; i <= 12; i++) { const a2 = (i * 30 - 90) * Math.PI / 180; nums += `<text x="${60 + 45 * Math.cos(a2)}" y="${60 + 45 * Math.sin(a2) + 4}" text-anchor="middle" font-size="10" fill="#2c3e50" font-weight="bold">${i}</text>`; }
            return `<div class="clock-svg"><svg width="130" height="130" viewBox="0 0 120 120"><circle cx="60" cy="60" r="55" fill="#fff" stroke="#2c3e50" stroke-width="3"/>${nums}<line x1="60" y1="60" x2="${hx}" y2="${hy}" stroke="#2c3e50" stroke-width="4" stroke-linecap="round"/><line x1="60" y1="60" x2="${mx}" y2="${my}" stroke="#e74c3c" stroke-width="2" stroke-linecap="round"/><circle cx="60" cy="60" r="3" fill="#2c3e50"/></svg></div>`;
        }

        const questions = [
            // ===== MULTIPLE CHOICE (No 1-10) =====
            { id: 1, type: "pg", section: "Multiple Choice", text: 'Look at the picture: A boy is watching TV in the living room. Complete the sentence: "He _____ watch TV in the living room."', options: ["can", "is", "are", "do"], answer: 0, hint: '"Can" is the modal auxiliary used to express ability or possibility.' },
            { id: 2, type: "pg", text: 'What activity can you do in the kitchen?', options: ["We can sleep in the kitchen", "We can cook in the kitchen", "We can swim in the kitchen", "We can play football in the kitchen"], answer: 1, hint: "The kitchen is the place where we cook food." },
            { id: 3, type: "pg", text: '"Can you read a book in the library?" The correct answer is...', options: ["Yes, I can", "Yes, I do", "No, I am", "Yes, I is"], answer: 0, hint: 'Questions with "can" are answered with "Yes, I can" or "No, I can\'t".' },
            { id: 4, type: "pg", text: 'Complete: "She _____ play the piano very well."', options: ["is", "can", "are", "am"], answer: 1, hint: '"Can" is used before a verb to express ability.' },
            { id: 5, type: "pg", text: 'Which sentence uses "can" correctly?', options: ["I can swimming", "I can to swim", "I can swim", "I can swims"], answer: 2, hint: 'After "can", use the base form of the verb (swim), not swimming/to swim/swims.' },
            { id: 6, type: "pg", text: '"My sister can _____ a bicycle." Choose the correct word.', options: ["rides", "riding", "rode", "ride"], answer: 3, hint: 'After "can", use the base form of the verb: ride.' },
            { id: 7, type: "pg", text: '"We _____ play in the garden." Choose the correct modal.', options: ["can", "is", "am", "are"], answer: 0, hint: '"Can" is the correct modal auxiliary for expressing ability.' },
            { id: 8, type: "pg", text: '"They can _____ in the swimming pool." Choose the correct word.', options: ["swims", "swimming", "swim", "to swim"], answer: 2, hint: 'After "can", always use the base form of the verb.' },
            { id: 9, type: "pg", text: `Look at the clock.${clockSvg(3, 0)}What time is it?`, options: ["It is two o'clock", "It is three o'clock", "It is four o'clock", "It is six o'clock"], answer: 1, hint: "The hour hand points to 3, so it is three o'clock." },
            { id: 10, type: "pg", text: `Look at the clock.${clockSvg(7, 30)}What time is it?`, options: ["It is seven thirty", "It is half past eight", "It is seven o'clock", "It is eight thirty"], answer: 0, hint: "The hour hand is between 7 and 8, and the minute hand points to 6, so it is seven thirty (7:30)." },

            // ===== PG KOMPLEKS (No 11-15) =====
            { id: 11, type: "pg_kompleks", section: "Complex Multiple Choice", text: 'Read the text:<div class="reading-box">My name is Rina. I live with my family. In the living room, we can watch TV together. My brother can play video games there too. In the kitchen, my mother can cook delicious food. In the bedroom, I can read books and sleep.</div>Based on the text, which statements are TRUE? (choose all correct answers)', options: ["Rina can watch TV in the living room", "Rina's brother can play video games in the bedroom", "Rina's mother can cook in the kitchen", "Rina can read books in the bedroom"], answer: [0, 2, 3], hint: "Rina's brother can play video games in the LIVING ROOM, not the bedroom." },
            { id: 12, type: "pg_kompleks", text: 'Based on the text about Rina, activities that can be done in the living room are... (choose all correct answers)', options: ["Watch TV", "Play video games", "Cook food", "Read books"], answer: [0, 1], hint: "Watching TV and playing video games are activities done in the living room. Cooking is in the kitchen, reading is in the bedroom." },
            { id: 13, type: "pg_kompleks", text: 'Read the text:<div class="reading-box">Today is Sunday. Ali wakes up at six o\'clock. He takes a bath at half past six. He has breakfast at seven o\'clock. Then, he goes to the park at eight o\'clock. He plays with his friends until ten o\'clock.</div>Based on the text, correct statements are... (choose all correct answers)', options: ["Ali wakes up at 6:00", "Ali takes a bath at 6:30", "Ali has breakfast at 8:00", "Ali goes to the park at 8:00"], answer: [0, 1, 3], hint: "Ali has breakfast at SEVEN o'clock (7:00), not eight." },
            { id: 14, type: "pg_kompleks", text: 'Based on the text about Ali, what Ali does in the morning are... (choose all correct answers)', options: ["Wake up", "Take a bath", "Have breakfast", "Go to school"], answer: [0, 1, 2], hint: "Ali goes to the PARK on Sunday, not to school." },
            { id: 15, type: "pg_kompleks", text: 'Activities that use modal "can" correctly are... (choose all correct answers)', options: ["I can swim", "She can cooking", "He can read", "They can plays"], answer: [0, 2], hint: 'After "can", always use the base form: swim, read. Not cooking or plays.' },

            // ===== PG KOMPLEKS (No 16-20) =====
            { id: 16, type: "pg_kompleks", text: 'Read the text:<div class="reading-box">Siti goes to school every day. She wakes up at five o\'clock. She takes a bath at half past five. She has breakfast at six o\'clock. She goes to school at half past six. She studies until twelve o\'clock.</div>Correct statements about Siti are... (choose all correct answers)', options: ["Siti wakes up at 5:00", "Siti has breakfast at 6:00", "Siti goes to school at 7:00", "Siti studies until 12:00"], answer: [0, 1, 3], hint: "Siti goes to school at HALF PAST SIX (6:30), not 7:00." },
            { id: 17, type: "pg_kompleks", text: 'Based on the text about Siti, what time does Siti do these activities? (choose all correct answers)', options: ["Takes a bath at 5:30", "Has breakfast at 6:00", "Goes to school at 6:30", "Studies until 1:00"], answer: [0, 1, 2], hint: "Siti studies until TWELVE o'clock (12:00), not 1:00." },
            { id: 18, type: "pg_kompleks", text: 'What you CAN do at school are... (choose all correct answers)', options: ["Study in the classroom", "Play in the playground", "Sleep on the road", "Read books in the library"], answer: [0, 1, 3], hint: "You don't sleep on the road at school." },
            { id: 19, type: "pg_kompleks", text: 'Rooms in a house and their activities that match are... (choose all correct answers)', options: ["Kitchen — cook food", "Bedroom — sleep", "Living room — take a bath", "Garden — play"], answer: [0, 1, 3], hint: "We take a bath in the BATHROOM, not the living room." },
            { id: 20, type: "pg_kompleks", text: 'Correct time expressions are... (choose all correct answers)', options: ["7:00 — seven o\'clock", "7:30 — half past seven", "7:00 — half past seven", "3:30 — half past three"], answer: [0, 1, 3], hint: "7:00 is seven o'clock, NOT half past seven." },

            // ===== BENAR / SALAH (No 21-30) =====
            { id: 21, type: "bs", section: "True or False", text: '"I go to school at seven o\'clock every morning." — Siti goes to school every morning.', answer: "Benar", hint: "True. The sentence says she goes to school every morning." },
            { id: 22, type: "bs", text: '"He takes a bath at half past five." — He takes a bath at 5:00.', answer: "Salah", hint: "False. Half past five means 5:30, not 5:00." },
            { id: 23, type: "bs", text: '"She can play the piano." — She is able to play the piano.', answer: "Benar", hint: 'True. "Can" means able to. Both sentences have the same meaning.' },
            { id: 24, type: "bs", text: '"We can cook in the bedroom." — This sentence is correct.', answer: "Salah", hint: "False. We cook in the kitchen, not in the bedroom." },
            { id: 25, type: "bs", text: '"They play football at four o\'clock." — They play football at 4:00.', answer: "Benar", hint: "True. Four o'clock = 4:00." },
            { id: 26, type: "bs", text: '"I wake up at six o\'clock." means I wake up at 6:00 AM.', answer: "Benar", hint: "True. Six o'clock in the context of waking up means 6:00 AM." },
            { id: 27, type: "bs", text: '"He can swims in the pool." is grammatically correct.', answer: "Salah", hint: 'False. After "can", use the base form "swim", not "swims".' },
            { id: 28, type: "bs", text: '"It is half past twelve" means the time is 12:30.', answer: "Benar", hint: "True. Half past twelve = 12:30." },
            { id: 29, type: "bs", text: '"She has dinner at seven o\'clock" means she eats dinner at 7:00 PM.', answer: "Benar", hint: "True. Dinner at seven o'clock in the evening = 7:00 PM." },
            { id: 30, type: "bs", text: '"He goes to bed at ten o\'clock" means he goes to bed at 10:00 AM.', answer: "Salah", hint: "False. Going to bed at ten o'clock means 10:00 PM (nighttime)." },

            // ===== ISIAN (No 31-35) =====
            { id: 31, type: "isian", section: "Fill in the Blanks", text: 'Complete: "I wake up at six _____ every morning." (fill with the correct word)', answer: "o'clock", hint: "o'clock is used after the hour to indicate the time." },
            { id: 32, type: "isian", text: 'Complete: "She _____ play badminton very well." (fill with the correct modal)', answer: "can", hint: '"Can" is the modal auxiliary used to express ability.' },
            { id: 33, type: "isian", text: 'Complete: "It is half _____ eight." (fill with the correct preposition)', answer: "past", hint: '"Half past" is the expression used for 30 minutes after the hour.' },
            { id: 34, type: "isian", text: '"I have breakfast at seven o\'clock." What time do I have breakfast? Answer: _____', answer: "7:00", hint: "Seven o'clock = 7:00" },
            { id: 35, type: "isian", text: '"She goes to school at half past six." What time does she go to school? Answer: _____', answer: "6:30", hint: "Half past six = 6:30" },

            // ===== URAIAN (No 36-40) =====
            { id: 36, type: "uraian", section: "Essay", text: '<div class="reading-box">Look at the activity table:<table class="table-box"><tr><th>Time</th><th>Activity</th></tr><tr><td>5:00 AM</td><td>Wake up</td></tr><tr><td>5:30 AM</td><td>Take a bath</td></tr><tr><td>6:00 AM</td><td>Have breakfast</td></tr><tr><td>6:30 AM</td><td>Go to school</td></tr><tr><td>12:00 PM</td><td>Go home</td></tr></table></div>Based on the table, what time does the student wake up?', answer: "The student wakes up at five o'clock / 5:00 AM.", hint: "Look at the first row of the table." },
            { id: 37, type: "uraian", text: "Based on the activity table above, write a short paragraph about the student's morning activities!", answer: "The student wakes up at five o'clock. Then, he/she takes a bath at half past five. After that, he/she has breakfast at six o'clock. Finally, he/she goes to school at half past six.", hint: "Use the table to write about each activity and its time." },
            { id: 38, type: "uraian", text: 'Based on the activity table, what does the student do at half past five?', answer: "The student takes a bath at half past five / 5:30 AM.", hint: "Half past five = 5:30 AM. Look at the second row of the table." },
            { id: 39, type: "uraian", text: "Write 3 activities that you CAN do at home using the modal 'can'!", answer: "Example: 1) I can watch TV in the living room. 2) I can cook in the kitchen. 3) I can read books in my bedroom. 4) I can play in the garden.", hint: 'Use the pattern: "I can + verb + in the + place."' },
            { id: 40, type: "uraian", text: 'Based on the activity table, how long does the student study at school? Explain your answer!', answer: "The student goes to school at 6:30 AM and goes home at 12:00 PM. So the student studies for 5 hours and 30 minutes at school.", hint: "Calculate from 6:30 AM to 12:00 PM." }
        ];

        const container = document.getElementById('question-container');
        let currentSection = '';
        function render() {
            let html = '';
            questions.forEach((q, idx) => {
                if (q.section && q.section !== currentSection) { currentSection = q.section; html += `<div class="section-title">${q.section}</div>`; }
                let inputHtml = '';
                if (q.type === 'pg') { q.options.forEach((opt, i) => { inputHtml += `<label class="radio-label"><input type="radio" name="q${q.id}" value="${i}"> ${String.fromCharCode(65 + i)}. ${opt}</label>`; }); }
                else if (q.type === 'pg_kompleks') { q.options.forEach((opt, i) => { inputHtml += `<label class="checkbox-label"><input type="checkbox" name="q${q.id}" value="${i}"> ${String.fromCharCode(65 + i)}. ${opt}</label>`; }); }
                else if (q.type === 'bs') { inputHtml += `<label class="radio-label"><input type="radio" name="q${q.id}" value="Benar"> ✅ True</label><label class="radio-label"><input type="radio" name="q${q.id}" value="Salah"> ❌ False</label>`; }
                else if (q.type === 'isian') { inputHtml = `<input type="text" class="input-text" name="q${q.id}" placeholder="Write your answer..." autocomplete="off">`; }
                else { inputHtml = `<textarea class="input-text" name="q${q.id}" placeholder="Write your complete answer..." rows="3"></textarea>`; }
                html += `<div class="question-item"><div class="q-text"><span class="q-number">${idx + 1}</span>${q.text}</div><div class="options-group">${inputHtml}</div><div class="feedback-box" id="fb-${q.id}"></div></div>`;
            });
            container.innerHTML = html; updateProgress();
        }
        function updateProgress() { let a = 0; questions.forEach(q => { if (q.type === 'pg' || q.type === 'bs') { if (document.querySelector(`input[name="q${q.id}"]:checked`)) a++; } else if (q.type === 'pg_kompleks') { if (document.querySelectorAll(`input[name="q${q.id}"]:checked`).length > 0) a++; } else { const el = document.querySelector(`[name="q${q.id}"]`); if (el && el.value.trim()) a++; } }); document.getElementById('progress-fill').style.width = `${(a / questions.length) * 100}%`; }
        document.addEventListener('change', updateProgress); document.addEventListener('input', updateProgress);
        function submitExam() {
            let s = 0, m = 0;
            questions.forEach(q => {
                const fb = document.getElementById(`fb-${q.id}`);
                if (q.type === 'pg') { m++; const sel = document.querySelector(`input[name="q${q.id}"]:checked`); if (sel && parseInt(sel.value) === q.answer) { s++; fb.className = 'feedback-box correct'; fb.innerHTML = '✅ Correct!'; } else { fb.className = 'feedback-box wrong'; fb.innerHTML = `❌ Wrong. ${q.hint}`; } }
                else if (q.type === 'pg_kompleks') { m++; const c = [...document.querySelectorAll(`input[name="q${q.id}"]:checked`)].map(x => parseInt(x.value)); if (c.length === q.answer.length && c.every(v => q.answer.includes(v))) { s++; fb.className = 'feedback-box correct'; fb.innerHTML = '✅ Correct!'; } else { fb.className = 'feedback-box wrong'; fb.innerHTML = `❌ Wrong. ${q.hint}`; } }
                else if (q.type === 'bs') { m++; const sel = document.querySelector(`input[name="q${q.id}"]:checked`); if (sel && sel.value === q.answer) { s++; fb.className = 'feedback-box correct'; fb.innerHTML = '✅ Correct!'; } else { fb.className = 'feedback-box wrong'; fb.innerHTML = `❌ Wrong. ${q.hint}`; } }
                else if (q.type === 'isian') { m++; const v = document.querySelector(`[name="q${q.id}"]`).value.trim().toLowerCase(); if (v === q.answer.toLowerCase()) { s++; fb.className = 'feedback-box correct'; fb.innerHTML = '✅ Correct!'; } else { fb.className = 'feedback-box wrong'; fb.innerHTML = `❌ Answer: <b>${q.answer}</b>. ${q.hint}`; } }
                else { fb.className = 'feedback-box manual'; fb.innerHTML = `📝 Check manually. Key: <b>${q.answer}</b>`; }
                fb.style.display = 'block';
            });
            document.getElementById('final-score').innerText = m > 0 ? Math.round((s / m) * 100) : 0;
            document.getElementById('score-detail').innerText = `Correct ${s} of ${m} questions. Essays checked manually.`;
            document.getElementById('score-board').style.display = 'block'; document.getElementById('footer-action').style.display = 'none';
            document.getElementById('progress-fill').style.width = '100%'; window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        render();
    </script>
</body>

</html>
