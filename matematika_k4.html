<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ujian Matematika Kelas 4 - SD Dilaraf</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #2980b9; --primary-light: #5dade2; --secondary: #3498db; --bg: #eaf2f8; --success: #27ae60; --error: #e74c3c; --warning: #f39c12; --card-bg: #ffffff; --text: #2d3436; --text-light: #636e72; --border: #dfe6e9; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; background: var(--bg); color: var(--text); padding: 0; min-height: 100vh; }
        .container { max-width: 850px; margin: 0 auto; background: var(--card-bg); border-radius: 0 0 20px 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); overflow: hidden; }
        .header { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; padding: 30px; text-align: center; position: relative; overflow: hidden; }
        .header::before { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 60%); animation: shimmer 8s infinite; }
        @keyframes shimmer { 0%,100% { transform: rotate(0deg); } 50% { transform: rotate(180deg); } }
        .header h1 { margin: 0; font-size: 2em; font-weight: 800; position: relative; z-index: 1; }
        .header p { margin-top: 5px; opacity: 0.9; font-size: 1em; position: relative; z-index: 1; }
        .header .badge { display: inline-block; background: rgba(255,255,255,0.2); padding: 4px 14px; border-radius: 20px; font-size: 0.8em; margin-top: 8px; position: relative; z-index: 1; }
        .progress-bar { height: 6px; background: var(--border); position: sticky; top: 0; z-index: 100; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, var(--success), #2ecc71); width: 0%; transition: width 0.5s ease; border-radius: 0 3px 3px 0; }
        .score-board { text-align: center; padding: 30px; background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; display: none; animation: slideDown 0.6s ease; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-30px); } to { opacity: 1; transform: translateY(0); } }
        .score-board h2 { font-size: 1.3em; margin-bottom: 5px; }
        .score-value { font-size: 4em; font-weight: 800; margin: 10px 0; text-shadow: 0 2px 10px rgba(0,0,0,0.2); }
        .score-board .detail { font-size: 0.9em; opacity: 0.9; }
        .back-btn { display: inline-block; margin-top: 15px; padding: 10px 25px; background: rgba(255,255,255,0.2); color: white; text-decoration: none; border-radius: 25px; font-weight: 700; transition: all 0.3s; border: 2px solid rgba(255,255,255,0.4); }
        .back-btn:hover { background: rgba(255,255,255,0.3); }
        .question-list { padding: 25px; }
        .section-title { font-size: 0.85em; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; color: var(--primary); margin: 30px 0 15px; padding: 10px 15px; background: var(--bg); border-radius: 10px; border-left: 4px solid var(--primary); }
        .question-item { margin-bottom: 25px; padding: 20px; border-radius: 12px; border: 2px solid var(--border); transition: all 0.3s; background: #fafbfc; }
        .question-item:hover { border-color: var(--primary-light); box-shadow: 0 4px 15px rgba(41,128,185,0.1); }
        .q-number { display: inline-block; background: var(--primary); color: white; width: 32px; height: 32px; border-radius: 50%; text-align: center; line-height: 32px; font-size: 0.85em; font-weight: 800; margin-right: 10px; }
        .q-text { font-size: 1em; line-height: 1.7; margin-bottom: 12px; }
        .q-image { text-align: center; margin: 15px 0; padding: 15px; background: white; border-radius: 10px; border: 2px dashed var(--border); }
        .q-image svg { max-width: 100%; height: auto; }
        .options-group { display: flex; flex-direction: column; gap: 8px; }
        .radio-label, .checkbox-label { display: flex; align-items: center; padding: 12px 15px; background: white; border: 2px solid var(--border); border-radius: 10px; cursor: pointer; transition: all 0.2s; font-size: 0.95em; }
        .radio-label:hover, .checkbox-label:hover { background: #ebf5fb; border-color: var(--primary-light); transform: translateX(5px); }
        input[type="radio"], input[type="checkbox"] { margin-right: 12px; transform: scale(1.3); accent-color: var(--primary); }
        .input-text { width: 100%; padding: 12px 15px; border: 2px solid var(--border); border-radius: 10px; font-size: 1em; font-family: 'Nunito', sans-serif; transition: border 0.3s; }
        .input-text:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(41,128,185,0.15); }
        textarea.input-text { min-height: 80px; resize: vertical; }
        .feedback-box { margin-top: 12px; padding: 12px 15px; border-radius: 10px; display: none; font-size: 0.9em; font-weight: 600; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .correct { background: #d4edda; color: #155724; border-left: 4px solid var(--success); }
        .wrong { background: #f8d7da; color: #721c24; border-left: 4px solid var(--error); }
        .manual { background: #fff3cd; color: #856404; border-left: 4px solid var(--warning); }
        .footer-action { background: var(--card-bg); padding: 20px; text-align: center; position: sticky; bottom: 0; border-top: 2px solid var(--border); box-shadow: 0 -4px 15px rgba(0,0,0,0.05); }
        .btn-submit { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%); color: white; border: none; padding: 15px 50px; font-size: 1.1em; border-radius: 50px; cursor: pointer; font-weight: 800; font-family: 'Nunito', sans-serif; transition: all 0.3s; box-shadow: 0 4px 15px rgba(41,128,185,0.3); }
        .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(41,128,185,0.4); }
        .btn-submit:active { transform: translateY(0); }
        @media (max-width: 600px) { .header h1 { font-size: 1.5em; } .question-list { padding: 15px; } .question-item { padding: 15px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>➗ Matematika</h1>
            <p>SD DILARAF ISLAMIC SCHOOL — Kelas 4 Al-Muhaimin</p>
            <div class="badge">ASTS Semester 2 • 2025/2026</div>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="score-board" id="score-board">
            <h2>📊 Hasil Ujian</h2>
            <div class="score-value" id="final-score">0</div>
            <p class="detail" id="score-detail"></p>
            <a href="kelas4.html" class="back-btn">⬅ Kembali ke Menu Kelas 4</a>
        </div>
        <div class="question-list" id="question-container"></div>
        <div class="footer-action" id="footer-action">
            <button class="btn-submit" onclick="submitExam()">Kumpulkan ✅</button>
        </div>
    </div>
    <script>
const questions = [
    // ===== PILIHAN GANDA (No 1-10) =====
    {id:1, type:"pg", section:"Pilihan Ganda", text:"Satuan luas tidak baku yang biasa digunakan untuk mengukur luas permukaan benda adalah...", options:["Meter","Liter","Petak persegi satuan","Kilogram"], answer:2, hint:"Petak persegi satuan adalah satuan luas tidak baku, sedangkan meter persegi adalah satuan baku."},
    {id:2, type:"pg", text:'Perhatikan gambar berikut!<div class="q-image"><svg width="200" height="160" viewBox="0 0 200 160"><rect x="10" y="10" width="180" height="140" fill="none" stroke="#bdc3c7" stroke-width="1"/><line x1="10" y1="45" x2="190" y2="45" stroke="#bdc3c7"/><line x1="10" y1="80" x2="190" y2="80" stroke="#bdc3c7"/><line x1="10" y1="115" x2="190" y2="115" stroke="#bdc3c7"/><line x1="55" y1="10" x2="55" y2="150" stroke="#bdc3c7"/><line x1="100" y1="10" x2="100" y2="150" stroke="#bdc3c7"/><line x1="145" y1="10" x2="145" y2="150" stroke="#bdc3c7"/><rect x="10" y="10" width="135" height="105" fill="#3498db" fill-opacity="0.3" stroke="#2980b9" stroke-width="2"/><text x="68" y="70" text-anchor="middle" font-size="14" fill="#2980b9" font-weight="bold">?</text></svg></div>Luas bidang yang diarsir pada gambar di atas adalah... petak persegi satuan.', options:["6","9","12","16"], answer:1, hint:"Bidang yang diarsir memiliki 3 kolom × 3 baris = 9 petak persegi satuan."},
    {id:3, type:"pg", text:"Satuan volume tidak baku yang biasa digunakan dalam kehidupan sehari-hari adalah...", options:["Centimeter kubik","Gelas","Meter persegi","Kilogram"], answer:1, hint:"Gelas adalah satuan volume tidak baku. Centimeter kubik adalah satuan volume baku."},
    {id:4, type:"pg", text:"Sebuah ember dapat diisi air sebanyak 8 gelas. Jika Ibu memiliki 3 ember, maka volume air seluruhnya adalah... gelas.", options:["11","16","24","32"], answer:2, hint:"3 ember × 8 gelas = 24 gelas."},
    {id:5, type:"pg", text:'Perhatikan gambar berikut!<div class="q-image"><svg width="200" height="140" viewBox="0 0 200 140"><rect x="20" y="20" width="160" height="100" fill="none" stroke="#bdc3c7" stroke-width="1"/><line x1="20" y1="45" x2="180" y2="45" stroke="#bdc3c7"/><line x1="20" y1="70" x2="180" y2="70" stroke="#bdc3c7"/><line x1="20" y1="95" x2="180" y2="95" stroke="#bdc3c7"/><line x1="52" y1="20" x2="52" y2="120" stroke="#bdc3c7"/><line x1="84" y1="20" x2="84" y2="120" stroke="#bdc3c7"/><line x1="116" y1="20" x2="116" y2="120" stroke="#bdc3c7"/><line x1="148" y1="20" x2="148" y2="120" stroke="#bdc3c7"/><rect x="20" y="20" width="160" height="100" fill="#e74c3c" fill-opacity="0.25" stroke="#c0392b" stroke-width="2"/></svg></div>Pernyataan yang benar tentang gambar di atas adalah...', options:["Luas bidang = 15 petak persegi satuan","Luas bidang = 20 petak persegi satuan","Luas bidang = 25 petak persegi satuan","Luas bidang = 30 petak persegi satuan"], answer:1, hint:"Bidang memiliki 5 kolom × 4 baris = 20 petak persegi satuan."},
    {id:6, type:"pg", text:'Segitiga yang ketiga sisinya memiliki panjang yang berbeda-beda disebut...', options:["Segitiga sama sisi","Segitiga sama kaki","Segitiga sembarang","Segitiga siku-siku"], answer:2, hint:"Segitiga sembarang memiliki ketiga sisi yang panjangnya berbeda-beda."},
    {id:7, type:"pg", text:'Perhatikan gambar segitiga berikut!<div class="q-image"><svg width="200" height="160" viewBox="0 0 200 160"><polygon points="100,15 30,145 170,145" fill="#9b59b6" fill-opacity="0.2" stroke="#8e44ad" stroke-width="2"/><text x="58" y="90" font-size="11" fill="#8e44ad">10 cm</text><text x="128" y="90" font-size="11" fill="#8e44ad">10 cm</text><text x="85" y="143" font-size="11" fill="#8e44ad">8 cm</text></svg></div>Segitiga di atas termasuk jenis segitiga...', options:["Sama sisi","Sama kaki","Sembarang","Siku-siku"], answer:1, hint:"Segitiga sama kaki memiliki 2 sisi yang sama panjang (10 cm dan 10 cm) dan 1 sisi yang berbeda (8 cm)."},
    {id:8, type:"pg", text:'Bangun datar yang memiliki dua pasang sisi berdekatan sama panjang dan salah satu diagonalnya merupakan sumbu simetri disebut...<div class="q-image"><svg width="160" height="120" viewBox="0 0 160 120"><polygon points="80,5 150,55 80,115 10,55" fill="#e67e22" fill-opacity="0.2" stroke="#d35400" stroke-width="2"/></svg></div>', options:["Persegi panjang","Belah ketupat","Layang-layang","Trapesium"], answer:2, hint:"Layang-layang memiliki 2 pasang sisi berdekatan yang sama panjang dan salah satu diagonalnya merupakan sumbu simetri."},
    {id:9, type:"pg", text:'Perhatikan gambar berikut!<div class="q-image"><svg width="160" height="150" viewBox="0 0 160 150"><polygon points="80,10 140,40 140,100 80,130 20,100 20,40" fill="#27ae60" fill-opacity="0.2" stroke="#1e8449" stroke-width="2"/></svg></div>Bangun datar di atas termasuk segi banyak beraturan yang bernama...', options:["Segi lima beraturan","Segi enam beraturan","Segi tujuh beraturan","Segi delapan beraturan"], answer:1, hint:"Bangun tersebut memiliki 6 sisi yang sama panjang, sehingga disebut segi enam beraturan."},
    {id:10, type:"pg", text:"Bangun datar tertutup yang dibatasi oleh tiga atau lebih ruas garis lurus disebut...", options:["Lingkaran","Segi banyak","Elips","Busur"], answer:1, hint:"Segi banyak (poligon) adalah bangun datar tertutup yang terbentuk dari tiga atau lebih ruas garis lurus."},

    // ===== PG KOMPLEKS (No 11-20) =====
    {id:11, type:"pg_kompleks", section:"Pilihan Ganda Kompleks", text:'Perhatikan gambar-gambar berikut!<div class="q-image"><svg width="340" height="100" viewBox="0 0 340 100"><polygon points="20,80 80,80 80,20 20,20" fill="#3498db" fill-opacity="0.2" stroke="#2980b9" stroke-width="2"/><text x="50" y="96" text-anchor="middle" font-size="10" fill="#2980b9">(i)</text><polygon points="120,80 200,80 180,20 140,20" fill="#e74c3c" fill-opacity="0.2" stroke="#c0392b" stroke-width="2"/><text x="160" y="96" text-anchor="middle" font-size="10" fill="#c0392b">(ii)</text><polygon points="240,20 300,20 300,80 240,80" fill="#27ae60" fill-opacity="0.2" stroke="#1e8449" stroke-width="2"/><text x="270" y="96" text-anchor="middle" font-size="10" fill="#1e8449">(iii)</text></svg></div>Bangun yang termasuk segi banyak beraturan adalah... (pilih semua yang benar)', options:["Gambar (i) — persegi","Gambar (ii) — trapesium","Gambar (iii) — persegi panjang","Semua gambar di atas"], answer:[0], hint:"Persegi adalah segi banyak beraturan karena semua sisinya sama panjang dan semua sudutnya sama besar. Trapesium dan persegi panjang bukan segi banyak beraturan."},
    {id:12, type:"pg_kompleks", text:"Ciri-ciri bangun segi banyak tidak beraturan adalah... (pilih semua yang benar)", options:["Semua sisinya sama panjang","Panjang sisinya tidak sama","Besar sudutnya tidak sama","Semua sudutnya sama besar"], answer:[1,2], hint:"Segi banyak tidak beraturan memiliki sisi yang tidak sama panjang dan sudut yang tidak sama besar."},
    {id:13, type:"pg_kompleks", text:"Berikut yang termasuk contoh segi banyak beraturan adalah... (pilih semua yang benar)", options:["Segitiga sama sisi","Persegi","Trapesium","Segi lima beraturan"], answer:[0,1,3], hint:"Segitiga sama sisi, persegi, dan segi lima beraturan termasuk segi banyak beraturan karena semua sisi dan sudutnya sama."},
    {id:14, type:"pg_kompleks", text:"Yang termasuk segi banyak tidak beraturan adalah... (pilih semua yang benar)", options:["Trapesium","Persegi","Layang-layang","Segitiga sama sisi"], answer:[0,2], hint:"Trapesium dan layang-layang termasuk segi banyak tidak beraturan."},
    {id:15, type:"pg_kompleks", text:"Ciri-ciri segi banyak beraturan adalah... (pilih semua yang benar)", options:["Semua sisinya sama panjang","Semua sudutnya sama besar","Sisinya bisa berbeda panjang","Memiliki minimal 3 sisi"], answer:[0,1,3], hint:"Segi banyak beraturan memiliki semua sisi sama panjang, semua sudut sama besar, dan minimal 3 sisi."},
    {id:16, type:"pg_kompleks", text:'Perhatikan gambar-gambar berikut!<div class="q-image"><svg width="340" height="110" viewBox="0 0 340 110"><polygon points="30,90 90,90 60,20" fill="#f39c12" fill-opacity="0.2" stroke="#e67e22" stroke-width="2"/><text x="60" y="106" text-anchor="middle" font-size="10" fill="#e67e22">(i)</text><polygon points="130,20 200,20 220,60 180,90 130,90" fill="#9b59b6" fill-opacity="0.2" stroke="#8e44ad" stroke-width="2"/><text x="170" y="106" text-anchor="middle" font-size="10" fill="#8e44ad">(ii)</text><polygon points="260,90 290,20 330,90" fill="#1abc9c" fill-opacity="0.2" stroke="#16a085" stroke-width="2"/><text x="295" y="106" text-anchor="middle" font-size="10" fill="#16a085">(iii)</text></svg></div>Yang termasuk segi banyak tidak beraturan adalah... (pilih semua yang benar)', options:["Gambar (i) — segitiga sembarang","Gambar (ii) — segi lima tidak beraturan","Gambar (iii) — segitiga sama kaki","Semua termasuk segi banyak tidak beraturan"], answer:[0,1], hint:"Segitiga sembarang dan segi lima tidak beraturan termasuk segi banyak tidak beraturan."},
    {id:17, type:"pg_kompleks", text:"Contoh bangun segi banyak beraturan dalam kehidupan sehari-hari adalah... (pilih semua yang benar)", options:["Ubin lantai berbentuk persegi","Rambu lalu lintas berbentuk segi delapan (STOP)","Meja berbentuk persegi panjang","Sarang lebah berbentuk segi enam beraturan"], answer:[0,1,3], hint:"Ubin persegi, rambu STOP (segi delapan beraturan), dan sarang lebah (segi enam beraturan) adalah contoh segi banyak beraturan."},
    {id:18, type:"pg_kompleks", text:"Pernyataan yang benar tentang segitiga siku-siku adalah... (pilih semua yang benar)", options:["Memiliki satu sudut 90°","Semua sisinya sama panjang","Memiliki 3 sisi dan 3 sudut","Sisi terpanjangnya disebut hipotenusa"], answer:[0,2,3], hint:"Segitiga siku-siku memiliki satu sudut 90°, 3 sisi dan 3 sudut, dan sisi terpanjangnya disebut hipotenusa."},
    {id:19, type:"pg_kompleks", text:"Perbedaan belah ketupat dan persegi adalah... (pilih semua yang benar)", options:["Belah ketupat tidak harus memiliki sudut 90°","Persegi memiliki semua sudut 90°","Belah ketupat dan persegi memiliki 4 sisi sama panjang","Belah ketupat tidak memiliki sisi yang sama panjang"], answer:[0,1,2], hint:"Belah ketupat dan persegi sama-sama memiliki 4 sisi sama panjang, tetapi persegi memiliki semua sudut 90° sedangkan belah ketupat tidak harus."},
    {id:20, type:"pg_kompleks", text:"Berikut yang termasuk contoh segi banyak tidak beraturan adalah... (pilih semua yang benar)", options:["Jajargenjang","Persegi","Segitiga sama sisi","Trapesium"], answer:[0,3], hint:"Jajargenjang dan trapesium termasuk segi banyak tidak beraturan karena sisi-sisinya tidak semuanya sama panjang."},

    // ===== BENAR / SALAH (No 21-30) =====
    {id:21, type:"bs", section:"Benar / Salah", text:"1 cm³ sama dengan volume 1 kubus kecil dengan sisi 1 cm.", answer:"Benar", hint:"Benar. 1 cm³ adalah volume sebuah kubus dengan panjang sisi 1 cm."},
    {id:22, type:"bs", text:"1 liter sama dengan 1.000 cm³.", answer:"Benar", hint:"Benar. 1 liter = 1.000 cm³ = 1 dm³."},
    {id:23, type:"bs", text:"Volume sebuah gelas lebih besar dari volume 1 ember.", answer:"Salah", hint:"Salah. Volume 1 ember jauh lebih besar dari volume 1 gelas."},
    {id:24, type:"bs", text:"1 m³ sama dengan 1.000 liter.", answer:"Benar", hint:"Benar. 1 m³ = 1.000 dm³ = 1.000 liter."},
    {id:25, type:"bs", text:"Luas 1 m × 1 m sama dengan 1 m².", answer:"Benar", hint:"Benar. 1 m × 1 m = 1 meter persegi (m²)."},
    {id:26, type:"bs", text:"Segitiga sama sisi memiliki 3 sisi yang sama panjang dan 3 sudut yang sama besar.", answer:"Benar", hint:"Benar. Setiap sudut segitiga sama sisi besarnya 60°."},
    {id:27, type:"bs", text:"Trapesium memiliki dua pasang sisi sejajar.", answer:"Salah", hint:"Salah. Trapesium hanya memiliki satu pasang sisi sejajar. Bangun yang memiliki dua pasang sisi sejajar adalah jajargenjang."},
    {id:28, type:"bs", text:"Persegi panjang termasuk segi banyak beraturan.", answer:"Salah", hint:"Salah. Persegi panjang memiliki sisi-sisi yang tidak semuanya sama panjang, sehingga bukan segi banyak beraturan."},
    {id:29, type:"bs", text:"Layang-layang memiliki dua diagonal yang saling tegak lurus.", answer:"Benar", hint:"Benar. Diagonal layang-layang saling berpotongan tegak lurus."},
    {id:30, type:"bs", text:"Lingkaran termasuk segi banyak.", answer:"Salah", hint:"Salah. Lingkaran bukan segi banyak karena tidak dibentuk dari ruas garis lurus."},

    // ===== ISIAN SINGKAT (No 31-35) =====
    {id:31, type:"isian", section:"Isian Singkat", text:"Bangun datar yang memiliki 3 sisi dan 3 sudut disebut...", answer:"Segitiga", hint:"Segitiga adalah bangun datar yang memiliki 3 sisi dan 3 sudut."},
    {id:32, type:"isian", text:"Bangun datar segi empat yang memiliki dua pasang sisi berdekatan sama panjang disebut...", answer:"Layang-layang", hint:"Layang-layang memiliki 2 pasang sisi berdekatan yang sama panjang."},
    {id:33, type:"isian", text:"Bangun datar segi empat yang keempat sisinya sama panjang dan kedua diagonalnya saling membagi dua sama panjang disebut...", answer:"Belah ketupat", hint:"Belah ketupat memiliki 4 sisi sama panjang dengan diagonal saling membagi dua sama panjang."},
    {id:34, type:"isian", text:"Bangun datar yang tidak memiliki sisi dan sudut, serta semua titik pada tepinya berjarak sama dari titik pusat disebut...", answer:"Lingkaran", hint:"Lingkaran tidak memiliki sisi dan sudut, semua titik pada tepinya berjarak sama dari pusat."},
    {id:35, type:"isian", text:"Bangun datar segi empat yang keempat sisinya sama panjang dan keempat sudutnya 90° disebut...", answer:"Persegi", hint:"Persegi memiliki 4 sisi sama panjang dan 4 sudut siku-siku (90°)."},

    // ===== URAIAN / ESAI (No 36-40) =====
    {id:36, type:"uraian", section:"Uraian / Esai", text:"Sebutkan 3 benda di sekitar rumah yang permukaannya dapat diukur dengan satuan meter persegi (m²)!", answer:"Contoh: lantai rumah, dinding kamar, atap rumah, halaman rumah, pintu, kaca jendela", hint:"Benda yang luas permukaannya cukup besar sehingga cocok diukur dalam m²."},
    {id:37, type:"uraian", text:"Sebutkan 5 benda di sekitar yang volumenya lebih dari 1 liter!", answer:"Contoh: ember, galon air, bak mandi, akuarium, tong sampah, kulkas", hint:"Pikirkan benda-benda di rumah yang dapat menampung lebih dari 1 liter air."},

const container = document.getElementById('question-container');
let currentSection = '';

function render() {
    let html = '';
    questions.forEach((q, idx) => {
        if (q.section && q.section !== currentSection) {
            currentSection = q.section;
            html += `<div class="section-title">${q.section}</div>`;
        }
        let inputHtml = '';
        if (q.type === 'pg') {
            q.options.forEach((opt, i) => {
                inputHtml += `<label class="radio-label"><input type="radio" name="q${q.id}" value="${i}"> ${String.fromCharCode(65+i)}. ${opt}</label>`;
            });
        } else if (q.type === 'pg_kompleks') {
            q.options.forEach((opt, i) => {
                inputHtml += `<label class="checkbox-label"><input type="checkbox" name="q${q.id}" value="${i}"> ${String.fromCharCode(65+i)}. ${opt}</label>`;
            });
        } else if (q.type === 'bs') {
            inputHtml += `<label class="radio-label"><input type="radio" name="q${q.id}" value="Benar"> ✅ Benar</label>`;
            inputHtml += `<label class="radio-label"><input type="radio" name="q${q.id}" value="Salah"> ❌ Salah</label>`;
        } else if (q.type === 'isian') {
            inputHtml = `<input type="text" class="input-text" name="q${q.id}" placeholder="Tulis jawaban di sini..." autocomplete="off">`;
        } else if (q.type === 'uraian') {
            inputHtml = `<textarea class="input-text" name="q${q.id}" placeholder="Tulis jawaban lengkap di sini..." rows="3"></textarea>`;
        }
        html += `<div class="question-item"><div class="q-text"><span class="q-number">${idx+1}</span>${q.text}</div><div class="options-group">${inputHtml}</div><div class="feedback-box" id="fb-${q.id}"></div></div>`;
    });
    container.innerHTML = html;
    updateProgress();
}

function updateProgress() {
    let answered = 0;
    questions.forEach(q => {
        if (q.type === 'pg' || q.type === 'bs') {
            if (document.querySelector(`input[name="q${q.id}"]:checked`)) answered++;
        } else if (q.type === 'pg_kompleks') {
            if (document.querySelectorAll(`input[name="q${q.id}"]:checked`).length > 0) answered++;
        } else {
            const el = document.querySelector(`[name="q${q.id}"]`);
            if (el && el.value.trim()) answered++;
        }
    });
    document.getElementById('progress-fill').style.width = `${(answered/questions.length)*100}%`;
}

document.addEventListener('change', updateProgress);
document.addEventListener('input', updateProgress);

function submitExam() {
    let score = 0, maxAuto = 0, totalPG = 0, correctPG = 0;
    questions.forEach(q => {
        const fb = document.getElementById(`fb-${q.id}`);
        if (q.type === 'pg') {
            maxAuto++; totalPG++;
            const sel = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (sel && parseInt(sel.value) === q.answer) { score++; correctPG++; fb.className='feedback-box correct'; fb.innerHTML='✅ Benar!'; }
            else { fb.className='feedback-box wrong'; fb.innerHTML=`❌ Salah. ${q.hint}`; }
        } else if (q.type === 'pg_kompleks') {
            maxAuto++;
            const checked = [...document.querySelectorAll(`input[name="q${q.id}"]:checked`)].map(c => parseInt(c.value));
            const correct = q.answer;
            if (checked.length === correct.length && checked.every(v => correct.includes(v))) { score++; fb.className='feedback-box correct'; fb.innerHTML='✅ Benar!'; }
            else { fb.className='feedback-box wrong'; fb.innerHTML=`❌ Salah. ${q.hint}`; }
        } else if (q.type === 'bs') {
            maxAuto++;
            const sel = document.querySelector(`input[name="q${q.id}"]:checked`);
            if (sel && sel.value === q.answer) { score++; fb.className='feedback-box correct'; fb.innerHTML='✅ Benar!'; }
            else { fb.className='feedback-box wrong'; fb.innerHTML=`❌ Salah. ${q.hint}`; }
        } else if (q.type === 'isian') {
            maxAuto++;
            const val = document.querySelector(`[name="q${q.id}"]`).value.trim().toLowerCase();
            if (val === q.answer.toLowerCase()) { score++; fb.className='feedback-box correct'; fb.innerHTML='✅ Benar!'; }
            else { fb.className='feedback-box wrong'; fb.innerHTML=`❌ Jawaban yang benar: <b>${q.answer}</b>. ${q.hint}`; }
        } else {
            fb.className='feedback-box manual'; fb.innerHTML=`📝 Periksa manual. Kunci: <b>${q.answer}</b>`;
        }
        fb.style.display = 'block';
    });
    const pct = maxAuto > 0 ? Math.round((score/maxAuto)*100) : 0;
    document.getElementById('final-score').innerText = pct;
    document.getElementById('score-detail').innerText = `Benar ${score} dari ${maxAuto} soal (PG, PG Kompleks, B/S, Isian). Soal uraian diperiksa manual.`;
    document.getElementById('score-board').style.display = 'block';
    document.getElementById('footer-action').style.display = 'none';
    document.getElementById('progress-fill').style.width = '100%';
    window.scrollTo({top: 0, behavior: 'smooth'});
}

render();
    </script>
