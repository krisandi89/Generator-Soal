            --primary-light: #74b9ff;
            --bg: #f0f8ff;

            --warning: #f39c12;

        }

        body {

            background: var(--bg);
            color: var(--text);
            padding: 0;
            min-height: 100vh;
        }
        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 0 0 20px 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            position: relative;
        }
        .nav-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }
        .back-btn-nav {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 700;
            border: 1px solid rgba(255,255,255,0.4);
            transition: all 0.2s;
        }
        .back-btn-nav:hover {
            background: rgba(255,255,255,0.35);
        }
        .header h1 {
            font-size: 2em;
            font-weight: 800;
            margin-bottom: 4px;
        }
        .header p {
            font-size: 0.95em;
            opacity: 0.95;
        }
        .badge {
            display: inline-block;
            background: rgba(255,255,255,0.25);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.82em;
            font-weight: 700;
            margin-top: 8px;
            border: 1px dashed rgba(255,255,255,0.6);
        }
        .progress-bar {
            height: 7px;
            background: var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), #2ecc71);
            width: 0%;
            transition: width 0.3s ease;
        }
        .score-board {
            text-align: center;
            padding: 30px 20px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            display: none;
            margin-bottom: 20px;
            animation: slideDown 0.5s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .score-val {
            font-size: 4em;
            font-weight: 800;
            margin: 10px 0;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
        }
        .score-detail {
            font-size: 1em;
            opacity: 0.95;
            margin-bottom: 15px;
            font-weight: 600;
        }
        .score-actions {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn-action {
            display: inline-block;
            padding: 10px 24px;
            background: rgba(255,255,255,0.2);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-weight: 700;
            transition: all 0.2s;
            border: 2px solid rgba(255,255,255,0.4);
            cursor: pointer;
        }
        .btn-action:hover {
            background: rgba(255,255,255,0.35);
        }
        .btn-retry {
            background: white;
            color: var(--primary);
            border-color: white;
        }
        .btn-retry:hover {
            background: #f1f2f6;
            color: var(--primary);
        }
        .question-list {
            padding: 25px 20px;
        }
        .section-title {
            font-size: 0.95em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: white;
            margin: 30px 0 15px;
            padding: 12px 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
        }
        .question-item {
            margin-bottom: 22px;
            padding: 20px;
            border-radius: 14px;
            border: 2px solid var(--border);
            background: #fafbfc;
            transition: all 0.2s;
        }
        .question-item:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        .q-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--primary);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 0.85em;
            font-weight: 800;
            margin-right: 10px;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        .q-text {
            font-size: 1.02em;
            line-height: 1.65;
            margin-bottom: 14px;
            font-weight: 600;
            color: #2d3436;
        }

            background: #fef9e7;
            border: 2px solid #f9e79f;
            border-radius: 10px;
            padding: 14px;
            margin: 10px 0 15px;
            line-height: 1.75;
            font-size: 0.95em;
        }
        .svg-box {
            background: #ffffff;
            border: 2px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            margin: 12px 0 14px;
            text-align: center;
            overflow-x: auto;
        }
        .svg-box svg {
            max-width: 100%;
            height: auto;
            display: inline-block;
        }
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .radio-label, .checkbox-label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95em;
            background: white;
            font-weight: 600;
        }
        .radio-label:hover, .checkbox-label:hover {
            border-color: var(--primary);
            background: #f0f8ff;
            transform: translateX(4px);
        }

            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            flex-shrink: 0;
        }

            border-color: var(--primary);
            background: #f0f8ff;
        }
        .match-select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.95em;
            background: white;
            cursor: pointer;
            font-weight: 600;
            outline: none;
            transition: border 0.2s;
        }
        .match-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(9, 132, 227, 0.15);
        }
        .input-text {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 0.98em;
            font-family: 'Nunito', sans-serif;
            transition: border 0.3s;
            outline: none;
            background: white;
        }
        .input-text:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(9, 132, 227, 0.15);
        }
        textarea.input-text {
            resize: vertical;
            min-height: 85px;
        }
        .feedback-box {
            margin-top: 14px;
            padding: 12px 16px;
            border-radius: 10px;
            display: none;
            font-size: 0.92em;
            line-height: 1.5;
            font-weight: 600;
        }

            background: #d4edda;
            color: #155724;
            border-left: 5px solid var(--success);
        }
        .wrong {
            background: #f8d7da;
            color: #721c24;
            border-left: 5px solid var(--error);
        }
        .manual {
            background: #fff3cd;
            color: #856404;
            border-left: 5px solid var(--warning);
        }
        .footer-action {
            background: var(--card-bg);
            padding: 20px;
            text-align: center;
            position: sticky;
            bottom: 0;
            border-top: 2px solid var(--border);
            box-shadow: 0 -4px 15px rgba(0,0,0,0.04);
        }
        .btn-submit {

            border: none;

            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 800;

</head>

        const container = document.getElementById('question-container');
        let currentSection = '';

        function render() {
            let html = '';
            questions.forEach((q, idx) => {
                if (q.section && q.section !== currentSection) {
                    currentSection = q.section;
                    html += `<div class="section-title">${q.section}</div>`;
                }
                let inputHtml = '';
                if (q.type === 'pg') {
                    q.options.forEach((opt, i) => {
                        inputHtml += `<label class="radio-label"><input type="radio" name="q${q.id}" value="${i}"> <span>${String.fromCharCode(65 + i)}. ${opt}</span></label>`;
                    });
                } else if (q.type === 'pg_kompleks') {
                    q.options.forEach((opt, i) => {
                        inputHtml += `<label class="checkbox-label"><input type="checkbox" name="q${q.id}" value="${i}"> <span>${String.fromCharCode(65 + i)}. ${opt}</span></label>`;
                    });
                } else if (q.type === 'memasangkan') {
                    inputHtml = `<select class="match-select" name="q${q.id}" onchange="updateProgress()">
                        <option value="">-- Pilih Pasangan yang Tepat --</option>
                        ${q.options.map(o => `<option value="${o}">${o}</option>`).join('')}
                    </select>`;
                } else if (q.type === 'isian') {
                    inputHtml = `<input type="text" class="input-text" name="q${q.id}" id="input-q${q.id}" placeholder="Tulis jawaban singkat di sini..." autocomplete="off">`;
                } else if (q.type === 'uraian') {
                    inputHtml = `<textarea class="input-text" name="q${q.id}" id="input-q${q.id}" placeholder="Tulis jawaban uraian lengkap di sini..." rows="3"></textarea>`;
                }
                html += `<div class="question-item" id="qcard-${q.id}">
                    <div class="q-text"><span class="q-number">${idx + 1}</span>${q.text}</div>
                    <div class="options-group">${inputHtml}</div>
                    <div class="feedback-box" id="fb-${q.id}"></div>
                </div>`;
            });
            container.innerHTML = html;
            updateProgress();
        }

        function updateProgress() {
            let answered = 0;
            questions.forEach(q => {
                if (q.type === 'pg') {
                    if (document.querySelector(`input[name="q${q.id}"]:checked`)) answered++;
                } else if (q.type === 'pg_kompleks') {
                    if (document.querySelectorAll(`input[name="q${q.id}"]:checked`).length > 0) answered++;
                } else if (q.type === 'memasangkan') {
                    const el = document.querySelector(`select[name="q${q.id}"]`);
                    if (el && el.value.trim()) answered++;
                } else {
                    const el = document.querySelector(`[name="q${q.id}"]`);
                    if (el && el.value.trim()) answered++;
                }
            });
            document.getElementById('progress-fill').style.width = `${(answered / questions.length) * 100}%`;
        }

        document.addEventListener('change', updateProgress);
        document.addEventListener('input', updateProgress);

        function cleanString(str) {
            return (str || '')
                .toLowerCase()
                .replace(/[.,/#!$%^&*;:{}=\-_`~()?'"“”]/g, ' ')
                .replace(/\s+/g, ' ')
                .trim();
        }

        function submitExam() {
            let score = 0;
            let maxAuto = 0;

            questions.forEach(q => {
                const fb = document.getElementById(`fb-${q.id}`);
                if (q.type === 'pg') {
                    maxAuto++;
                    const sel = document.querySelector(`input[name="q${q.id}"]:checked`);
                    if (sel && parseInt(sel.value) === q.answer) {
                        score++;
                        fb.className = 'feedback-box correct';
                        fb.innerHTML = '✅ <b>Benar!</b> ' + (q.hint || '');
                    } else {
                        fb.className = 'feedback-box wrong';
                        const correctOpt = q.options[q.answer];
                        fb.innerHTML = `❌ <b>Kurang tepat.</b> Jawaban benar: <b>${String.fromCharCode(65 + q.answer)}. ${correctOpt}</b>. <br>💡 <i>${q.hint || ''}</i>`;
                    }
                } else if (q.type === 'pg_kompleks') {
                    maxAuto++;
                    const checked = [...document.querySelectorAll(`input[name="q${q.id}"]:checked`)].map(c => parseInt(c.value));
                    const isAllCorrect = checked.length === q.answer.length && checked.every(v => q.answer.includes(v));
                    if (isAllCorrect) {
                        score++;
                        fb.className = 'feedback-box correct';
                        fb.innerHTML = '✅ <b>Benar Semua!</b> ' + (q.hint || '');
                    } else {
                        fb.className = 'feedback-box wrong';
                        const correctLetters = q.answer.map(i => `${String.fromCharCode(65 + i)}. ${q.options[i]}`).join('; ');
                        fb.innerHTML = `❌ <b>Jawaban yang benar:</b> <b>${correctLetters}</b>.<br>💡 <i>${q.hint || ''}</i>`;
                    }
                } else if (q.type === 'memasangkan') {
                    maxAuto++;
                    const sel = document.querySelector(`select[name="q${q.id}"]`);
                    const val = sel ? sel.value.trim() : '';
                    if (val && cleanString(val) === cleanString(q.answer)) {
                        score++;
                        fb.className = 'feedback-box correct';
                        fb.innerHTML = '✅ <b>Pasangan Tepat!</b> ' + (q.hint || '');
                    } else {
                        fb.className = 'feedback-box wrong';
                        fb.innerHTML = `❌ <b>Pasangan yang benar:</b> <b>${q.answer}</b>.<br>💡 <i>${q.hint || ''}</i>`;
                    }
                } else if (q.type === 'isian') {
                    maxAuto++;
                    const inputEl = document.querySelector(`[name="q${q.id}"]`);
                    const val = cleanString(inputEl.value);
                    const target = cleanString(q.answer);
                    let isCorrect = val === target || (target.length > 3 && val.includes(target)) || (val.length > 3 && target.includes(val));
                    if (q.alt && Array.isArray(q.alt)) {
                        q.alt.forEach(a => {
                            const altClean = cleanString(a);
                            if (val === altClean || (altClean.length > 3 && val.includes(altClean)) || (val.length > 3 && altClean.includes(val))) {
                                isCorrect = true;
                            }
                        });
                    }
                    if (isCorrect) {
                        score++;
                        fb.className = 'feedback-box correct';
                        fb.innerHTML = '✅ <b>Benar!</b> ' + (q.hint || '');
                    } else {
                        fb.className = 'feedback-box wrong';
                        fb.innerHTML = `❌ <b>Jawaban tepat:</b> <b>${q.answer}</b>.<br>💡 <i>${q.hint || ''}</i>`;
                    }
                } else if (q.type === 'uraian') {
                    fb.className = 'feedback-box manual';
                    fb.innerHTML = `📝 <b>Kunci Jawaban Model / Pembahasan:</b><br>${q.answer}<br><br>💡 <i>Petunjuk Guru: ${q.hint || ''}</i>`;
                }
                fb.style.display = 'block';
            });

            const finalPct = maxAuto > 0 ? Math.round((score / maxAuto) * 100) : 0;
            document.getElementById('final-score').innerText = finalPct;
            document.getElementById('score-detail').innerText = `Benar ${score} dari ${maxAuto} soal pilihan otomatis (PG, PG Kompleks, Memasangkan, Isian). 5 Soal Uraian diperiksa secara mandiri/oleh guru.`;
            document.getElementById('score-board').style.display = 'block';
            document.getElementById('footer-action').style.display = 'none';
            document.getElementById('progress-fill').style.width = '100%';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function retryExam() {
            questions.forEach(q => {
                if (q.type === 'pg' || q.type === 'pg_kompleks') {
                    document.querySelectorAll(`input[name="q${q.id}"]`).forEach(i => i.checked = false);
                } else if (q.type === 'memasangkan') {
                    const sel = document.querySelector(`select[name="q${q.id}"]`);
                    if (sel) sel.value = '';
                } else {
                    const el = document.querySelector(`[name="q${q.id}"]`);
                    if (el) el.value = '';
                }
                const fb = document.getElementById(`fb-${q.id}`);
                if (fb) fb.style.display = 'none';
            });
            document.getElementById('score-board').style.display = 'none';
            document.getElementById('footer-action').style.display = 'block';
            document.getElementById('progress-fill').style.width = '0%';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        render();
    </script>
