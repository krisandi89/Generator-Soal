<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Latihan Soal Matematika Kelas 3 - SDIT Friends</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2980b9;
            --primary-light: #3498db;
            --bg: #eaf2f8;
            --success: #27ae60;
            --error: #e74c3c;
            --warning: #f39c12;
            --card-bg: #ffffff;
            --text: #2d3436;
            --border: #dfe6e9;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg);
            color: var(--text);
            padding: 20px 10px;
            min-height: 100vh;
        }
        .container {
            max-width: 860px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            border: 2px solid var(--border);
        }
        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            position: relative;
        }
        .nav-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        .back-btn-nav {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255,255,255,0.25);
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.88em;
            font-weight: 700;
            transition: all 0.2s;
            border: 1px solid rgba(255,255,255,0.4);
        }
        .back-btn-nav:hover {
            background: rgba(255,255,255,0.4);
            transform: translateX(-3px);
        }
        .header h1 {
            font-size: 1.85em;
            font-weight: 800;
            margin-bottom: 6px;
        }
        .header p {
            font-size: 0.95em;
            opacity: 0.95;
        }
        .badge {
            display: inline-block;
            background: rgba(255,255,255,0.25);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 0.82em;
            font-weight: 700;
            margin-top: 10px;
            border: 1px dashed rgba(255,255,255,0.6);
        }
        .progress-bar {
            height: 9px;
            background: #e2e8f0;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            width: 0%;
            transition: width 0.3s ease;
        }
        .score-board {
            display: none;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid var(--border);
        }
        .score-board h2 {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        .score-val {
            font-size: 3.8em;
            font-weight: 800;
            color: #f1c40f;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            margin: 5px 0;
        }
        .score-detail {
            font-size: 1.05em;
            opacity: 0.95;
            margin-bottom: 20px;
            line-height: 1.5;
        }
        .score-actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        .btn-action {
            padding: 10px 24px;
            border-radius: 50px;
            font-weight: 700;
            cursor: pointer;
            border: none;
            text-decoration: none;
            font-size: 0.92em;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: white;
            color: #1e3c72;
        }
        .btn-action:hover {
            background: #f1f2f6;
            transform: translateY(-2px);
        }
        .question-list {
            padding: 25px 20px;
        }
        .section-title {
            font-size: 0.98em;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: white;
            margin: 32px 0 16px;
            padding: 12px 18px;
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.06);
        }
        .question-item {
            margin-bottom: 22px;
            padding: 20px;
            border-radius: 14px;
            border: 2px solid var(--border);
            background: #fafbfc;
            transition: all 0.2s;
        }
        .question-item:hover {
            border-color: var(--primary);
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }
        .q-number {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--primary);
            color: white;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 0.85em;
            font-weight: 800;
            margin-right: 10px;
            flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(0,0,0,0.12);
        }
        .q-text {
            font-size: 1.03em;
            line-height: 1.65;
            margin-bottom: 14px;
            font-weight: 600;
            color: #2d3436;
        }
        .options-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .radio-label, .checkbox-label {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-radius: 10px;
            border: 2px solid var(--border);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95em;
            background: white;
            font-weight: 600;
        }
        .radio-label:hover, .checkbox-label:hover {
            border-color: var(--primary);
            background: #f8fbff;
            transform: translateX(4px);
        }
        .radio-label input[type="radio"], .checkbox-label input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            flex-shrink: 0;
        }
        .radio-label:has(input:checked), .checkbox-label:has(input:checked) {
            border-color: var(--primary);
            background: #eef6ff;
        }
        /* Benar Salah Styling */
        .tf-group {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }
        .tf-label {
            flex: 1;
            min-width: 130px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 18px;
            border-radius: 10px;
            border: 2px solid var(--border);
            background: white;
            cursor: pointer;
            font-weight: 700;
            font-size: 0.98em;
            transition: all 0.2s;
        }
        .tf-label:hover {
            border-color: var(--primary);
            background: #f8fbff;
        }
        .tf-label:has(input:checked) {
            border-color: var(--primary);
            background: #eef6ff;
            color: var(--primary);
        }
        .tf-label input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
        }
        /* Match Select */
        .match-box {
            background: white;
            border: 2px solid var(--border);
            border-radius: 10px;
            padding: 14px 16px;
        }
        .match-premise {
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 0.98em;
        }
        .match-select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-family: 'Nunito', sans-serif;
            font-size: 0.95em;
            background: #fdfefe;
            cursor: pointer;
            font-weight: 600;
            outline: none;
            transition: border 0.2s;
        }
        .match-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(9, 132, 227, 0.15);
        }
        .input-text {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border);
            border-radius: 10px;
            font-size: 0.98em;
            font-family: 'Nunito', sans-serif;
            transition: border 0.3s;
            outline: none;
            background: white;
        }
        .input-text:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(9, 132, 227, 0.15);
        }
        textarea.input-text {
            resize: vertical;
            min-height: 85px;
            line-height: 1.5;
        }
        .feedback-box {
            margin-top: 14px;
            padding: 14px 18px;
            border-radius: 10px;
            display: none;
            font-size: 0.93em;
            line-height: 1.55;
            font-weight: 600;
        }
        .correct {
            background: #d4edda;
            color: #155724;
            border-left: 5px solid var(--success);
        }
        .wrong {
            background: #f8d7da;
            color: #721c24;
            border-left: 5px solid var(--error);
        }
        .manual {
            background: #fff3cd;
            color: #856404;
            border-left: 5px solid var(--warning);
        }
        .footer-action {
            background: var(--card-bg);
            padding: 20px;
            text-align: center;
            position: sticky;
            bottom: 0;
            border-top: 2px solid var(--border);
            box-shadow: 0 -4px 15px rgba(0,0,0,0.04);
        }
        .btn-submit {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
            color: white;
            border: none;
            padding: 14px 45px;
            font-size: 1.1em;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 800;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.25);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="nav-top">
                <a href="kelas3.html" class="back-btn-nav">⬅ Menu Kelas 3</a>
                <span style="font-size: 0.85em; opacity: 0.95;">10 Soal Isian</span>
            </div>
            <h1>➗ Matematika</h1>
            <p>SDIT Friends — Kelas 3</p>
            <div class="badge">Bab 2: Perkalian dan Pembagian Bilangan Cacah (Hal. 38–50)</div>
        </div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
        <div class="score-board" id="score-board">
            <h2>📊 Hasil Latihan Ulangan</h2>
            <div class="score-val" id="final-score">0</div>
            <p class="score-detail" id="score-detail"></p>
            <div class="score-actions">
                <button onclick="retryExam()" class="btn-action">🔄 Coba Lagi</button>
                <a href="kelas3.html" class="btn-action">⬅ Kembali ke Menu Kelas 3</a>
            </div>
        </div>
        <div class="question-list" id="question-container"></div>
        <div class="footer-action" id="footer-action">
            <button class="btn-submit" onclick="submitExam()">Kumpulkan Jawaban ✅</button>
        </div>
    </div>

    <script>
        const questions = [
            {
                "id": 1,
                "type": "isian",
                "text": "Hasil dari 6 × 7 adalah ....",
                "answer": "42",
                "alt": [
                    "empat puluh dua"
                ],
                "hint": "6 × 7 = 7 + 7 + 7 + 7 + 7 + 7 = 42.",
                "section": "Isian Singkat (10 Soal)"
            },
            {
                "id": 2,
                "type": "isian",
                "text": "Hasil dari 8 × 9 adalah ....",
                "answer": "72",
                "alt": [
                    "tujuh puluh dua"
                ],
                "hint": "8 × 9 = 72."
            },
            {
                "id": 3,
                "type": "isian",
                "text": "Penjumlahan 4 + 4 + 4 + 4 + 4 sama dengan 5 × 4. Hasilnya adalah ....",
                "answer": "20",
                "alt": [
                    "dua puluh"
                ],
                "hint": "Ada lima kelompok yang masing-masing berisi 4, sehingga 5 × 4 = 20."
            },
            {
                "id": 4,
                "type": "isian",
                "text": "Hasil dari 7 × 0 adalah ....",
                "answer": "0",
                "alt": [
                    "nol"
                ],
                "hint": "Bilangan apa pun yang dikalikan dengan 0 menghasilkan 0."
            },
            {
                "id": 5,
                "type": "isian",
                "text": "Lengkapilah sesuai sifat pertukaran perkalian: 6 × 8 = .... × 6.",
                "answer": "8",
                "alt": [
                    "delapan"
                ],
                "hint": "Posisi bilangan dalam perkalian boleh ditukar: 6 × 8 = 8 × 6."
            },
            {
                "id": 6,
                "type": "isian",
                "text": "Hasil dari 23 × 3 adalah ....",
                "answer": "69",
                "alt": [
                    "enam puluh sembilan"
                ],
                "hint": "23 × 3 = (20 × 3) + (3 × 3) = 60 + 9 = 69."
            },
            {
                "id": 7,
                "type": "isian",
                "text": "Hasil dari 56 : 7 adalah ....",
                "answer": "8",
                "alt": [
                    "delapan"
                ],
                "hint": "56 : 7 = 8 karena 8 × 7 = 56."
            },
            {
                "id": 8,
                "type": "isian",
                "text": "Hasil dari 84 : 4 adalah ....",
                "answer": "21",
                "alt": [
                    "dua puluh satu"
                ],
                "hint": "84 : 4 = (80 : 4) + (4 : 4) = 20 + 1 = 21."
            },
            {
                "id": 9,
                "type": "isian",
                "text": "Ibu menyiapkan 6 kantong. Setiap kantong berisi 5 jeruk. Jumlah seluruh jeruk adalah .... buah.",
                "answer": "30",
                "alt": [
                    "tiga puluh",
                    "30 buah",
                    "tiga puluh buah"
                ],
                "hint": "Jumlah jeruk = 6 × 5 = 30 buah."
            },
            {
                "id": 10,
                "type": "isian",
                "text": "Sebanyak 48 buku dibagikan sama banyak kepada 8 anak. Setiap anak mendapat .... buku.",
                "answer": "6",
                "alt": [
                    "enam",
                    "6 buku",
                    "enam buku"
                ],
                "hint": "Buku untuk setiap anak = 48 : 8 = 6 buku."
            }
        ];

        function render() {
            const container = document.getElementById('question-container');
            let html = '';
            questions.forEach((q, idx) => {
                if (q.section) {
                    html += `<div class="section-title">${q.section}</div>`;
                }
                let inputHtml = '';
                if (q.type === 'pg') {
                    q.options.forEach((opt, i) => {
                        inputHtml += `<label class="radio-label"><input type="radio" name="q${q.id}" value="${i}"> <span>${String.fromCharCode(65 + i)}. ${opt}</span></label>`;
                    });
                } else if (q.type === 'pg_kompleks') {
                    inputHtml += `<div style="font-size:0.85em; color:#7f8c8d; margin-bottom:6px; font-weight:700;">📌 <i>Pilih lebih dari satu jawaban yang benar:</i></div>`;
                    q.options.forEach((opt, i) => {
                        inputHtml += `<label class="checkbox-label"><input type="checkbox" name="q${q.id}" value="${i}"> <span>${String.fromCharCode(65 + i)}. ${opt}</span></label>`;
                    });
                } else if (q.type === 'benar_salah') {
                    inputHtml = `<div class="tf-group">
                        <label class="tf-label"><input type="radio" name="q${q.id}" value="Benar"> <span>🟢 Benar</span></label>
                        <label class="tf-label"><input type="radio" name="q${q.id}" value="Salah"> <span>🔴 Salah</span></label>
                    </div>`;
                } else if (q.type === 'memasangkan') {
                    inputHtml = `<div class="match-box">
                        <div class="match-premise">Pasangkan pernyataan: <b>"${q.premise || q.text}"</b></div>
                        <select class="match-select" name="q${q.id}" onchange="updateProgress()">
                            <option value="">-- Pilih Pasangan yang Tepat --</option>
                            ${q.options.map(o => `<option value="${o}">${o}</option>`).join('')}
                        </select>
                    </div>`;
                } else if (q.type === 'isian') {
                    inputHtml = `<input type="text" class="input-text" name="q${q.id}" id="input-q${q.id}" aria-label="Jawaban soal ${idx + 1}" placeholder="Tulis jawaban singkat di sini..." autocomplete="off">`;
                } else if (q.type === 'uraian') {
                    inputHtml = `<textarea class="input-text" name="q${q.id}" id="input-q${q.id}" placeholder="Tulis jawaban uraian lengkap di sini..." rows="3"></textarea>`;
                }
                html += `<div class="question-item" id="qcard-${q.id}">
                    <div class="q-text"><span class="q-number">${idx + 1}</span>${q.text}</div>
                    <div class="options-group">${inputHtml}</div>
                    <div class="feedback-box" id="fb-${q.id}"></div>
                </div>`;
            });
            container.innerHTML = html;
            updateProgress();
        }

        function updateProgress() {
            let answered = 0;
            questions.forEach(q => {
                if (q.type === 'pg' || q.type === 'benar_salah') {
                    if (document.querySelector(`input[name="q${q.id}"]:checked`)) answered++;
                } else if (q.type === 'pg_kompleks') {
                    if (document.querySelectorAll(`input[name="q${q.id}"]:checked`).length > 0) answered++;
                } else if (q.type === 'memasangkan') {
                    const el = document.querySelector(`select[name="q${q.id}"]`);
                    if (el && el.value.trim()) answered++;
                } else {
                    const el = document.querySelector(`[name="q${q.id}"]`);
                    if (el && el.value.trim()) answered++;
                }
            });
            document.getElementById('progress-fill').style.width = `${(answered / questions.length) * 100}%`;
        }

        document.addEventListener('change', updateProgress);
        document.addEventListener('input', updateProgress);

        function cleanString(str) {
            return (str || '')
                .normalize('NFKC')
                .toLowerCase()
                .replace(/[’‘]/g, "'")
                .replace(/\s+/g, ' ')
                .trim()
                .replace(/[.!?]+$/, '')
                .trim();
        }

        function submitExam() {
            let score = 0;
            let maxAuto = 0;

            questions.forEach(q => {
                const fb = document.getElementById(`fb-${q.id}`);
                if (q.type === 'pg') {
                    maxAuto++;
                    const sel = document.querySelector(`input[name="q${q.id}"]:checked`);
                    if (sel && parseInt(sel.value) === q.answer) {
                        score++;
                        fb.className = 'feedback-box correct';
                        fb.innerHTML = '✅ <b>Benar!</b> ' + (q.hint || '');
                    } else {
                        fb.className = 'feedback-box wrong';
                        const correctOpt = q.options[q.answer];
                        fb.innerHTML = `❌ <b>Kurang tepat.</b> Jawaban benar: <b>${String.fromCharCode(65 + q.answer)}. ${correctOpt}</b>. <br>💡 <i>${q.hint || ''}</i>`;
                    }
                } else if (q.type === 'pg_kompleks') {
                    maxAuto++;
                    const checked = [...document.querySelectorAll(`input[name="q${q.id}"]:checked`)].map(c => parseInt(c.value));
                    const isAllCorrect = checked.length === q.answer.length && checked.every(v => q.answer.includes(v));
                    if (isAllCorrect) {
                        score++;
                        fb.className = 'feedback-box correct';
                        fb.innerHTML = '✅ <b>Benar Semua!</b> ' + (q.hint || '');
                    } else {
                        fb.className = 'feedback-box wrong';
                        const correctLetters = q.answer.map(i => `${String.fromCharCode(65 + i)}. ${q.options[i]}`).join('; ');
                        fb.innerHTML = `❌ <b>Jawaban yang benar:</b> <b>${correctLetters}</b>.<br>💡 <i>${q.hint || ''}</i>`;
                    }
                } else if (q.type === 'benar_salah') {
                    maxAuto++;
                    const sel = document.querySelector(`input[name="q${q.id}"]:checked`);
                    const val = sel ? sel.value : '';
                    if (val === q.answer) {
                        score++;
                        fb.className = 'feedback-box correct';
                        fb.innerHTML = '✅ <b>Tepat Sekali!</b> Pernyataan ini memang <b>' + q.answer + '</b>. ' + (q.hint || '');
                    } else {
                        fb.className = 'feedback-box wrong';
                        fb.innerHTML = `❌ <b>Kurang tepat.</b> Pernyataan ini seharusnya: <b>${q.answer}</b>.<br>💡 <i>${q.hint || ''}</i>`;
                    }
                } else if (q.type === 'memasangkan') {
                    maxAuto++;
                    const sel = document.querySelector(`select[name="q${q.id}"]`);
                    const val = sel ? sel.value.trim() : '';
                    if (val && cleanString(val) === cleanString(q.answer)) {
                        score++;
                        fb.className = 'feedback-box correct';
                        fb.innerHTML = '✅ <b>Pasangan Tepat!</b> ' + (q.hint || '');
                    } else {
                        fb.className = 'feedback-box wrong';
                        fb.innerHTML = `❌ <b>Pasangan yang benar:</b> <b>${q.answer}</b>.<br>💡 <i>${q.hint || ''}</i>`;
                    }
                } else if (q.type === 'isian') {
                    maxAuto++;
                    const inputEl = document.querySelector(`[name="q${q.id}"]`);
                    const val = cleanString(inputEl ? inputEl.value : '');
                    const isCorrect = val !== '' && [q.answer, ...(q.alt || [])].some(a => val === cleanString(a));
                    if (isCorrect) {
                        score++;
                        fb.className = 'feedback-box correct';
                        fb.innerHTML = '✅ <b>Benar!</b> ' + (q.hint || '');
                    } else {
                        fb.className = 'feedback-box wrong';
                        fb.innerHTML = `❌ <b>Jawaban tepat:</b> <b>${q.answer}</b>.<br>💡 <i>${q.hint || ''}</i>`;
                    }
                } else if (q.type === 'uraian') {
                    fb.className = 'feedback-box manual';
                    fb.innerHTML = `📝 <b>Model Kunci Jawaban:</b><br>${q.answer}<br><br>💡 <i>Petunjuk Penilaian: ${q.hint || ''}</i>`;
                }
                fb.style.display = 'block';
            });

            const finalPct = maxAuto > 0 ? Math.round((score / maxAuto) * 100) : 0;
            document.getElementById('final-score').innerText = finalPct + '%';
            document.getElementById('score-detail').innerText = `Benar ${score} dari ${maxAuto} soal isian. Setiap jawaban benar bernilai 10 poin.`;
            document.getElementById('score-board').style.display = 'block';
            document.getElementById('footer-action').style.display = 'none';
            document.getElementById('progress-fill').style.width = '100%';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function retryExam() {
            questions.forEach(q => {
                if (q.type === 'pg' || q.type === 'pg_kompleks' || q.type === 'benar_salah') {
                    document.querySelectorAll(`input[name="q${q.id}"]`).forEach(i => i.checked = false);
                } else if (q.type === 'memasangkan') {
                    const sel = document.querySelector(`select[name="q${q.id}"]`);
                    if (sel) sel.value = '';
                } else {
                    const el = document.querySelector(`[name="q${q.id}"]`);
                    if (el) el.value = '';
                }
                const fb = document.getElementById(`fb-${q.id}`);
                if (fb) fb.style.display = 'none';
            });
            document.getElementById('score-board').style.display = 'none';
            document.getElementById('footer-action').style.display = 'block';
            document.getElementById('progress-fill').style.width = '0%';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        render();
    </script>
</body>
</html>
